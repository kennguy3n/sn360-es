name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.11"
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # We invoke through `make lint` so the openapi-check
          # prerequisite still runs.
          args: --timeout=5m
          install-mode: binary

      - name: make lint
        run: make lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: make test
        run: make test

      - name: make cover
        run: make cover

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  test-integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: make test-integration
        run: make test-integration

  migrate-check-online:
    name: Migration Round-Trip (online)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Docker is available
        run: |
          docker version
          docker info

      - name: make migrate-check-online
        # Boots a transient Postgres, applies all migrations up,
        # rolls them all back, then re-applies — catches broken
        # down() migrations and non-idempotent up() at PR time.
        # See Makefile for the rationale.
        run: make migrate-check-online

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  corpus-eval:
    name: WS-4b Corpus Eval (detection-quality regression)
    # Detection-quality regression harness: runs the production
    # Tier 0 / (Tier 1 when configured) / Tier 2 cascade against
    # the committed synthetic corpus, diffs the per-label F1 scores
    # against testdata/corpus-eval/baseline.json, and fails when
    # any label drops by more than 5 F1 points (catastrophic drops
    # over 25 F1 points always fail and are flagged separately).
    #
    # The job runs on every PR but is intentionally not in the
    # `build` needs list, so PR merges are not blocked when the
    # job fails — the WS-4b spec wants detection-quality regressions
    # to be visible without becoming a merge gate for unrelated PRs.
    # Pushes to main run the same job and ARE expected to be green
    # (a regression at merge-to-main time is a real signal).
    #
    # Tier 1 and Tier 2 are skipped in CI by design: bringing up the
    # XLM-RoBERTa encoder service requires a GPU pod, and the SLM
    # is gated behind a model file that is downloaded at deploy
    # time (see deployments/llm/download-model.sh). The corpus
    # harness surfaces both as `tier1_configured: false` /
    # `tier2_configured: false` in the report so reviewers don't
    # mistake Tier 0-only metrics for full-pipeline metrics.
    runs-on: ubuntu-latest
    needs: [lint, test]
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify synthetic corpus and baseline are committed
        run: |
          set -euo pipefail
          test -f testdata/corpus-eval/synthetic.jsonl
          test -f testdata/corpus-eval/baseline.json
          echo "corpus and baseline OK"

      - name: Run corpus harness against committed synthetic corpus
        # We tee stderr to the run log AND a file so the summary
        # appears in the GitHub Actions step output even when the
        # binary exits non-zero (regression detected).
        run: |
          set -euo pipefail
          mkdir -p testdata/corpus-eval/reports
          go run ./cmd/corpus-eval \
            -corpus=testdata/corpus-eval/synthetic.jsonl \
            -baseline=testdata/corpus-eval/baseline.json \
            -tolerance=0.05 \
            -out=testdata/corpus-eval/reports/ci-${{ github.run_id }}.json \
            -fail-on-regression=true

      - name: Upload corpus-eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-eval-report-${{ github.run_id }}
          path: testdata/corpus-eval/reports/
          retention-days: 30

  adversarial-fuzz:
    name: WS-4b Adversarial Fuzz (property tests)
    # The adversarial perturbation property tests are a thin
    # superset of `make test`, but we surface them as a dedicated
    # job so the WS-4b "silent misclassification is a fail"
    # invariant is visible in the CI status checklist. The job
    # runs the property tests (100 iterations per perturbation
    # kind, fixed seed) plus the perturbation-function unit tests.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test ./internal/test/adversarial/...
        run: go test -v -count=1 -run 'TestProperty_|Test' ./internal/test/adversarial/...

  cost-model:
    name: Cost Model Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run cost-model regression tests
        # The cost-model script in scripts/cost_model/project.py
        # underpins benchmarks/COST_MODEL.md. The tests pin the
        # batch-efficiency multiplier and the levers-on-strictly-
        # cheaper-than-baseline-off invariant. A failure here means
        # someone changed the cost levers in a way that violates
        # the documented assumptions — those changes need a doc
        # update in the same PR.
        run: python -m unittest scripts/cost_model/test_project.py

  # NOTE: license-check used to live in a dedicated job here, but that
  # duplicated work the `lint` job already does — `make lint` depends
  # on `make license-check` via the Makefile prereq. One CI surface
  # (matching what contributors run locally) is the correct shape.
  # See cmd/sn360-es-license-check/ for the classifier + .license-waivers.txt.

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...

      - name: Build Docker image for scanning
        run: docker build -t sn360-es:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sn360-es:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  addin-tests:
    name: Add-in Tests (Outlook + Gmail)
    # WS-7b: pre-send Office.js (Outlook) and Apps Script (Gmail)
    # add-ins. The Outlook suite uses Node's built-in test runner
    # plus office-addin-mock to simulate the Office.js context; the
    # Gmail suite loads the .gs source through vm.runInContext with
    # hand-stubbed Apps Script globals (Session / Utilities /
    # UrlFetchApp / GmailApp / Gmail / CardService / CacheService).
    # Both exercise the three pre-send flows (recipient risk,
    # lookalike, external-thread) with table-driven cases.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          # Hash the lockfile so the npm cache invalidates whenever a
          # locked dependency version changes — hashing package.json
          # alone would let semver-range patch updates ride on a stale
          # node_modules cache.
          cache-dependency-path: deployments/addins/package-lock.json

      - name: Install add-in test deps
        working-directory: deployments/addins
        run: npm install --no-audit --no-fund

      - name: Run add-in tests
        working-directory: deployments/addins
        run: npm test

  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    # The build job gates the published image on every upstream
    # quality check that has a deterministic verdict for the merge
    # commit. In particular:
    #
    #   - migrate-check-online: a broken `down()` migration or a
    #     non-idempotent `up()` migration must NOT reach the
    #     image registry, because the operator runbook trusts
    #     down-then-up as a recovery primitive. Gating here is the
    #     last opportunity to catch it before tag.
    #
    #   - cost-model: the cost-model regression suite pins
    #     contracts that benchmarks/COST_MODEL.md depends on (Tier 1
    #     batch-efficiency multiplier, levers-on strictly cheaper
    #     than baseline-off). Shipping an image whose lever-effect
    #     constants drift from the docs is a documentation-bug, but
    #     more importantly it would silently invalidate the
    #     unit-economics dashboard. Treat it as a build-gating
    #     contract.
    #
    # license-check is intentionally NOT a separate `needs` here:
    # it runs inside the `lint` job via `make lint`'s Makefile
    # prereq, so `needs: [lint, ...]` already gates the build on a
    # green license verdict. One CI surface for static-analysis
    # gates (matching what contributors run locally) is the
    # correct shape.
    needs: [lint, test, test-integration, migrate-check-online, cost-model, security-scan, addin-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: make build
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image (PR / non-main)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}

      - name: Build & push Docker image (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}
            ${{ env.GHCR_IMAGE }}:latest

  e2e:
    name: End-to-End Smoke (testcontainers + load harness)
    # Optional / opt-in: PR validation does not block on this slow
    # job. It runs automatically on pushes to main and can be
    # triggered manually from the Actions UI.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify Docker is available
        run: docker info

      - name: make test-e2e
        run: make test-e2e

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start app + dependencies (compose)
        run: |
          docker compose up -d --build
          # Wait for the stack to come up. If healthz never responds we
          # must fail this step rather than fall through into the k6
          # job — k6 would otherwise blow past its http_req_failed
          # threshold against a dead service and the failure would read
          # as "load test threshold exceeded" instead of the real cause.
          healthy=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "app is healthy"
              healthy=true
              break
            fi
            sleep 2
          done
          if [ "$healthy" != "true" ]; then
            echo "app failed to become healthy within 60s"
            docker compose logs
            exit 1
          fi

      - name: k6 smoke (load harness)
        env:
          K6_TARGET: http://localhost:8080
        run: k6 run tests/load/smoke.js

      - name: Tear down
        if: always()
        run: docker compose down -v || true
