apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn360-es-encoder
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-encoder
    app.kubernetes.io/component: tier1-inference
    app.kubernetes.io/part-of: sn360-es
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sn360-es-encoder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sn360-es-encoder
        app.kubernetes.io/component: tier1-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: sn360-es-encoder
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Prefer scheduling onto GPU nodes if available, but tolerate
      # CPU-only fallback so smaller environments still work.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["g4dn.xlarge", "g5.xlarge", "g5.2xlarge"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sn360-es-encoder
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: sn360-es-encoder-models
      containers:
        - name: encoder
          image: ghcr.io/kennguy3n/sn360-es-encoder:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MODEL_DIR
              value: /models
            - name: MODEL_NAME
              value: xlm-roberta-base
            - name: MODEL_TAG
              value: xlm-roberta-finetune-v1
            - name: WARMUP_ON_STARTUP
              value: "1"
            - name: USE_CUDA
              value: "1"
            - name: LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "4"
              memory: 6Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sn360-es-encoder
  namespace: sn360-es
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sn360-es-encoder-models
  namespace: sn360-es
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
