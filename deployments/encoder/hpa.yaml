apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sn360-es-encoder
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-encoder
    app.kubernetes.io/part-of: sn360-es
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sn360-es-encoder
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Custom metric: queue depth on the JetStream consumer that feeds
    # this encoder. The Prometheus adapter must surface this as
    # `external.metrics.k8s.io/v1beta1` for this block to activate.
    - type: External
      external:
        metric:
          name: nats_consumer_pending_messages
          selector:
            matchLabels:
              consumer: es-evaluate-batch
              stream: ES_EVALUATE
        target:
          type: AverageValue
          averageValue: "50"
