apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sn360-es-encoder
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-encoder
    app.kubernetes.io/part-of: sn360-es
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sn360-es-encoder
  # Tier-1 encoder fleet. The queue-depth external metric is the
  # primary scaling signal; CPU/memory stay declared as guard rails so
  # a hot pod still triggers scale-up even if the metrics adapter is
  # momentarily unavailable. The HPA takes the MAX recommendation
  # across all three metrics.
  #
  # minReplicas: 2 is a deliberate HA floor. Every email flows through
  # this Tier-1 encoder, so a single-pod floor would mean any pod loss
  # at a low-traffic trough (node drain/eviction, crash, or a rolling
  # deploy) stalls Tier-1 throughput until the replacement GPU pod is
  # Ready — for a GPU pod that's image pull + model load + scheduling,
  # i.e. minutes. The queue is JetStream-backed so nothing is dropped,
  # but the evaluation-latency SLO would breach fleet-wide. Two warm
  # replicas keep the SLO intact through single-pod failure and give
  # zero-gap rolling updates, at the cost of one extra idle GPU.
  #
  # maxReplicas: 12 matches the established Tier-1 ceiling. With the
  # averageValue: 100 per-pod target below, the fleet can absorb a
  # sustained backlog of ~1200 pending before saturating; the
  # SN360ESEncoderCapacityExhausted alert pages well before that (at
  # max replicas AND >200 pending).
  minReplicas: 2
  maxReplicas: 12
  behavior:
    scaleDown:
      # 5-minute scale-down stabilization: the HPA holds the highest
      # desired-replica recommendation seen in this window before
      # shrinking, so a queue that briefly drains below the target
      # (pending < ~10) doesn't immediately remove a pod and flap on
      # the next burst.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    # Custom metric: queue depth on the JetStream consumer that feeds
    # this encoder (the es.evaluate.request stream). The Prometheus
    # adapter must surface this as `external.metrics.k8s.io/v1beta1`
    # for this block to activate.
    #
    # averageValue "100" encodes the scale-up target: the HPA adds
    # encoder pods to keep the mean pending-message count per pod at
    # ~100, so a sustained backlog above 100 grows the fleet (up to
    # maxReplicas). Combined with the 300s scaleDown stabilization
    # above, the fleet only shrinks once the backlog has stayed low
    # (well under ~10/pod) for the full window — the scale-down floor
    # the spec calls for.
    - type: External
      external:
        metric:
          name: nats_consumer_pending_messages
          selector:
            matchLabels:
              consumer: es-evaluate-batch
              stream: ES_EVALUATE
        target:
          type: AverageValue
          averageValue: "100"
