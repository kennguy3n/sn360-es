{{- /*
  Monolith Deployment. Emitted only when the role-split topology
  is DISABLED — in that mode the chart instead renders one
  Deployment per role from templates/deployment-role.yaml (so the
  cluster has `sn360-es-api`, `sn360-es-consumers`,
  `sn360-es-workers` instead of a single `sn360-es`).

  Operators upgrading from the monolith to the split topology
  should flip `roleSplit.enabled=true` and accept the rename:
  Helm will delete this Deployment and create the three new
  per-role ones. Two-step migration (deploy split alongside
  monolith with `replicaCount: 0`, then drain, then switch
  traffic) is out-of-scope for the chart but documentable.
*/}}
{{- if not .Values.roleSplit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sn360-es.fullname" . }}
  labels:
    {{- include "sn360-es.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sn360-es.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "sn360-es.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- range $k, $v := .Values.podAnnotations }}
        {{ $k }}: {{ tpl ($v | toString) $ | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sn360-es.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sn360-es
          image: "{{ include "sn360-es.image" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "sn360-es.fullname" . }}
            {{- if .Values.secret.create }}
            - secretRef:
                name: {{ include "sn360-es.fullname" . }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Build the final affinity dict by merging the chart's
        auto-generated podAntiAffinity rule into whatever the operator
        supplied via .Values.affinity. We MUST do the merge in Helm
        dict-space (not by rendering both halves under a single
        `affinity:` key with two `toYaml`s) — emitting
        `podAntiAffinity:` twice would produce a YAML document with
        duplicate mapping keys, and kubectl silently drops the user's
        rules.

        Merge semantics:
          1. deepCopy .Values.affinity so we never mutate the values
             tree (Helm reuses the same object across renders).
          2. Append the chart's HA rule to
             podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
             — the operator's preferred-list (and any other affinity
             keys like nodeAffinity / podAffinity / required rules)
             pass through intact. The chart's rule is appended
             UNCONDITIONALLY when podHA is on; if the operator also
             provided a hostname-spread preferred rule of their own,
             both entries coexist (Kubernetes treats duplicate
             preferred rules as reinforcement, which is harmless and
             safer than trying to deep-equal-compare topologyKey +
             labelSelector to dedup them in template logic).
      */ -}}
      {{- $haOn := and .Values.podHA .Values.podHA.enabled -}}
      {{- $aff := deepCopy (default (dict) .Values.affinity) -}}
      {{- if $haOn -}}
        {{- $haPref := dict "weight" (int .Values.podHA.podAntiAffinity.weight)
              "podAffinityTerm" (dict
                "labelSelector" (dict "matchLabels" (fromYaml (include "sn360-es.selectorLabels" .)))
                "topologyKey" .Values.podHA.podAntiAffinity.topologyKey) -}}
        {{- $existingPA := default (dict) (get $aff "podAntiAffinity") -}}
        {{- $existingPref := default (list) (get $existingPA "preferredDuringSchedulingIgnoredDuringExecution") -}}
        {{- $mergedPref := append $existingPref $haPref -}}
        {{- $_ := set $existingPA "preferredDuringSchedulingIgnoredDuringExecution" $mergedPref -}}
        {{- $_ := set $aff "podAntiAffinity" $existingPA -}}
      {{- end }}
      {{- if $aff }}
      affinity:
        {{- toYaml $aff | nindent 8 }}
      {{- end }}
      {{- if or .Values.topologySpreadConstraints (and .Values.podHA .Values.podHA.enabled) }}
      topologySpreadConstraints:
        {{- with .Values.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if and .Values.podHA .Values.podHA.enabled }}
        - maxSkew: {{ .Values.podHA.topologySpread.maxSkew }}
          topologyKey: {{ .Values.podHA.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.podHA.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "sn360-es.selectorLabels" . | nindent 14 }}
        {{- end }}
      {{- end }}
{{- end }}
