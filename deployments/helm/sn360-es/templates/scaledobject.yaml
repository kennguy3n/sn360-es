{{- /*
  KEDA ScaledObject for the consumers role.

  When enabled, KEDA owns the HPA lifecycle for the consumers
  Deployment (KEDA creates and manages a HorizontalPodAutoscaler
  underneath) and scales by NATS JetStream consumer lag plus a
  Prometheus-derived consumer-stuck signal — CPU stops being a
  meaningful proxy for "do we need more consumers" once the
  bottleneck shifts upstream (Tier-2 SLM RPC, Postgres write
  amplification under burst).

  Two triggers, evaluated independently — KEDA scales to
  max(replica-count-each-trigger-would-produce):

    1. NATS JetStream consumer lag (primary, roadmap Task 6)
       Queries the NATS monitoring HTTP endpoint
       (`/jsz?consumers=true`) for `num_pending` on the
       `evaluate-svc` consumer of stream `ES_EVALUATE`. The
       per-replica target is `lagThresholdMessages` (default
       1000) — at 2 000 pending msgs the scaler asks for 2
       replicas, at 10 000 it asks for 10, capped at
       `maxReplicaCount`. `activationLagThreshold` (default
       100) governs scale-from-zero hysteresis when
       `minReplicaCount = 0` and otherwise is the floor below
       which lag is considered "drained" for cooldown purposes.
       This trigger is the canonical capacity signal: a single
       in-flight Tier-2 call holding a goroutine doesn't show
       up on CPU but DOES show up here as N+1 pending msgs.

    2. Prometheus `event_lag_seconds` (secondary, stuck-consumer
       safety net) Catches the failure mode where lag is small
       in absolute terms but THE OLDEST queued message is
       stale — e.g. the durable consumer is
       partially-deadlocked behind a slow Tier-2 call and only
       a handful of msgs are queued but each has been waiting
       >>lagThresholdSeconds. Without this trigger a small
       absolute backlog of long-stuck messages wouldn't scale
       up.

  Requirements:
    - KEDA operator installed (kedacore/keda chart, namespace `keda`).
    - NATS monitoring endpoint reachable from the KEDA pod at
      `natsMonitoringAddress` (the nats helm chart exposes
      :8222 on the `<release>-nats` service by default; the
      JetStream-only nats chart values opens this automatically).
    - Prometheus reachable at `prometheusServerAddress` (for the
      secondary trigger; remove this trigger if you don't run
      Prometheus).
    - The `event_lag_seconds{component="consumer"}` metric
      exported by the binary (registered in pkg/telemetry,
      gauged from the consumer loop's lag-reporting tick).

  Mutual exclusivity with the per-role HPA: when keda.enabled is
  true, the per-role HPA template (`hpa-role.yaml`) skips emission
  ONLY for the consumers role to avoid duplicate ownership
  warnings on the deployment KEDA manages. The api role continues
  to emit its CPU-based HPA unchanged. The workers role
  intentionally has autoscaling disabled in values.yaml — it's a
  fixed-replica singleton with leader election via the Redis
  distributed lock, so it never produces an HPA regardless of
  KEDA state. This is the "(a) scope KEDA-only to consumers and
  keep HPA for the others" path referenced in the original
  design notes — see hpa-role.yaml's
  $skipForKeda := and $kedaOn (eq $role "consumers") for the
  per-role gate.
*/}}
{{- if and .Values.keda.enabled (not .Values.roleSplit.enabled) }}
{{- fail "keda.enabled=true requires roleSplit.enabled=true — KEDA scales the dedicated `consumers` Deployment, which only exists in the role-split topology. Either flip roleSplit.enabled=true (see deployment-role.yaml) or set keda.enabled=false." }}
{{- end }}
{{- if and .Values.roleSplit.enabled .Values.keda.enabled }}
{{- if hasKey .Values.roleSplit.roles "consumers" }}
{{- $ctx := . }}
{{- $cfg := .Values.keda.consumers }}
{{- $nats := $cfg.nats }}
{{- if not $nats.monitoringAddress }}
{{- fail "keda.consumers.nats.monitoringAddress is required when keda.enabled=true — set it to the NATS monitoring endpoint (e.g. http://<release>-nats:8222)" }}
{{- end }}
{{- /*
  monitoringAddress supports Helm templating (e.g. the default
  `http://{{ .Release.Name }}-nats:8222`) so we pipe it through
  `tpl` against the chart context — same pattern as
  `pgbouncer.upstream.host` and the top-level
  `config.natsURL`.
*/}}
{{- $natsMonitoringAddr := tpl $nats.monitoringAddress $ctx }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sn360-es.roleFullname" (dict "ctx" $ctx "role" "consumers") }}
  labels:
    {{- include "sn360-es.roleLabels" (dict "ctx" $ctx "role" "consumers") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sn360-es.roleFullname" (dict "ctx" $ctx "role" "consumers") }}
  pollingInterval: {{ $cfg.pollingInterval }}
  cooldownPeriod: {{ $cfg.cooldownPeriod }}
  minReplicaCount: {{ $cfg.minReplicaCount }}
  maxReplicaCount: {{ $cfg.maxReplicaCount }}
  triggers:
    {{- /*
      Primary: NATS JetStream consumer lag (roadmap Task 6 spec).
      Threshold is the per-replica target — KEDA computes
      desired_replicas = ceil(num_pending / lagThreshold).
    */}}
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ $natsMonitoringAddr | quote }}
        account: {{ $nats.account | default "$G" | quote }}
        stream: {{ $nats.stream | quote }}
        consumer: {{ $nats.consumer | quote }}
        lagThreshold: {{ $nats.lagThresholdMessages | quote }}
        activationLagThreshold: {{ $nats.activationLagThresholdMessages | quote }}
        {{- if $nats.useHTTPS }}
        useHttps: {{ $nats.useHTTPS | quote }}
        {{- end }}
    {{- if $cfg.prometheusEnabled }}
    {{- /*
      Secondary: Prometheus `event_lag_seconds` stuck-consumer
      safety net. Disable by setting
      `keda.consumers.prometheusEnabled: false` if you don't run
      Prometheus or want strict NATS-lag-only scaling.
    */}}
    - type: prometheus
      metadata:
        serverAddress: {{ $cfg.prometheusServerAddress | quote }}
        metricName: event_lag_seconds
        threshold: {{ $cfg.lagThresholdSeconds | quote }}
        query: |-
          {{- $cfg.query | nindent 10 }}
    {{- end }}
{{- end }}
{{- end }}
