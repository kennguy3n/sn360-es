{{- /*
  Monolith Service. Emitted only when role-split is OFF — in
  split mode the api-role Service is rendered from
  templates/service-role.yaml (consumers and workers don't
  expose business HTTP, so they don't get a Service of their
  own; their probes are hit cluster-internally via pod IP).
*/}}
{{- if not .Values.roleSplit.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sn360-es.fullname" . }}
  labels:
    {{- include "sn360-es.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "sn360-es.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}
