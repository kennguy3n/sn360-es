# Development overlay — pinned to a single replica with relaxed
# resource limits. Pair with `helm upgrade --install -f values.dev.yaml`.
replicaCount: 1
autoscaling:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
config:
  logLevel: debug
  eventBusType: nats
nats:
  enabled: true
  config:
    cluster:
      enabled: false
      replicas: 1
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 1Gi
