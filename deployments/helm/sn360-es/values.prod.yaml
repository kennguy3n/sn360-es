# Production overlay — three-replica HA, autoscaling enabled, NATS
# JetStream three-node cluster with persistent volumes.
replicaCount: 3
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
config:
  logLevel: info
  eventBusType: nats
  pgSSLMode: verify-full
nats:
  enabled: true
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 50Gi
serviceMonitor:
  enabled: true
ingress:
  enabled: false
# Production HA scheduling. We delegate to the chart's podHA block
# (rendered by templates/deployment.yaml) rather than spelling out
# topologySpreadConstraints / affinity inline because the chart
# auto-injects the labelSelector via `include "sn360-es.selectorLabels"`.
# That keeps the spread + anti-affinity selectors in lock-step with
# the Deployment selector even when `nameOverride` or
# `fullnameOverride` is set on a downstream install.
#
# - topologySpread: maxSkew=1 across zones with DoNotSchedule, so the
#   HPA cannot over-load a single AZ — even if that means a fourth
#   replica waits for a healthy zone.
# - podAntiAffinity: preferred-only hostname spread (weight=100) so a
#   tight cluster can still schedule replicas during a burst, but the
#   default behaviour avoids stacking the fleet on one node.
podHA:
  enabled: true

# PgBouncer sidecar — REQUIRED for 5,000-tenant production scale.
#
# Each application pod (monolith OR each role-split pod) gets a
# PgBouncer sidecar listening on 127.0.0.1:6432 and the app's
# PG_HOST is rewritten to that loopback. This collapses the
# fleet-wide Postgres connection budget from `replicaCount *
# maxOpenConns` (potentially hundreds at 5k tenants and the
# default 12-replica autoscaling cap) down to the bouncer's
# `maxClientConn` * pods, keeping Postgres' own
# `max_connections` ceiling viable.
#
# Pool mode stays at the chart default of `session` because the
# RLS tenant-binding code in `pkg/storage/postgres/tenant_context.go`
# uses session-level `set_config(..., false)` and assumes one
# PgBouncer client = one backend conn for the GUC's lifetime.
# See the long comment on `pgbouncer.upstream.poolMode` in
# values.yaml for the future path to transaction pooling.
#
# `upstream.host` is intentionally left empty so the bouncer
# inherits `config.pgHost` (the chart's primary Postgres host).
# Override in cluster-specific overlays (e.g. RDS endpoint) when
# the prod Postgres lives outside the cluster.
pgbouncer:
  enabled: true
