# Default values for sn360-es.
#
# Each top-level block maps 1:1 to a template under templates/. Override
# any field on the command line with --set or in a values file passed to
# `helm install -f`.

# nameOverride / fullnameOverride trim or replace the auto-generated
# resource names. Leave empty to use the chart name.
nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/kennguy3n/sn360-es
  tag: ""            # defaults to .Chart.AppVersion when empty
  pullPolicy: IfNotPresent
  pullSecrets: []    # [{name: regcred}]

# replicaCount only applies when autoscaling.enabled is false and
# roleSplit.enabled is false. When roleSplit.enabled=true the
# top-level replicaCount / autoscaling / resources blocks are
# IGNORED and the chart emits one Deployment per role under
# `roleSplit.roles` instead — see that block below.
replicaCount: 2

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations:
  # Force a rolling restart when the rendered ConfigMap changes.
  checksum/config: "{{ include \"sn360-es.configChecksum\" . }}"
  # Scrape /metrics by default; Prometheus operator users can rely on
  # ServiceMonitor instead.
  prometheus.io/scrape: "true"
  prometheus.io/path: "/metrics"
  prometheus.io/port: "8080"
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# Container port served by sn360-es's HTTP listener (system + REST
# endpoints, /metrics, /docs, /healthz, /readyz).
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Pod scheduling. nodeSelector / tolerations / affinity /
# topologySpreadConstraints are passed through verbatim for advanced
# overrides. For the common production case (multi-AZ HA with the
# right pod selector), prefer the higher-level `podHA` block below —
# it guarantees the labelSelector stays in sync with the Deployment
# selector even when `nameOverride` / `fullnameOverride` are set.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# podHA: opt-in HA scheduling. When enabled, the chart generates
# topologySpreadConstraints + podAntiAffinity using the chart's own
# `selectorLabels` include, so the selectors cannot drift from the
# Deployment label set under `nameOverride`. Disabled by default so
# the bundled chart still installs cleanly on single-node clusters.
# Raw `affinity` / `topologySpreadConstraints` above still apply on
# top, so an operator can layer custom rules without losing the
# auto-injected selector.
podHA:
  enabled: false
  # topologySpread distributes replicas across this topology key. The
  # production overlay sets this to topology.kubernetes.io/zone; on
  # single-AZ clusters set it to kubernetes.io/hostname instead.
  topologySpread:
    topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    # DoNotSchedule blocks the HPA from over-loading one zone. Set
    # to ScheduleAnyway if you want best-effort spread that still
    # admits new pods under cluster pressure.
    whenUnsatisfiable: DoNotSchedule
  # podAntiAffinity is a soft (preferred) hostname-level rule so a
  # single node loss never evicts the majority of the fleet.
  podAntiAffinity:
    weight: 100
    topologyKey: kubernetes.io/hostname

# probes — see internal/handler/health.go for endpoint semantics.
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6

# Application configuration projected into a ConfigMap and consumed via
# env vars. Anything sensitive (DB/Redis passwords, JWT signing keys,
# KMS aliases) belongs in the secret block below.
config:
  logLevel: info
  eventBusType: nats         # nats | redis
  natsURL: "nats://{{ .Release.Name }}-nats:4222"
  redisAddr: "{{ .Release.Name }}-redis-master:6379"
  pgHost: "{{ .Release.Name }}-postgresql"
  pgPort: "5432"
  pgUser: sn360es
  pgDB: sn360es
  pgSSLMode: require

secret:
  # Render a Kubernetes Secret with these keys. Leave a value empty to
  # bind via externalSecrets / sealed-secrets instead.
  create: true
  annotations: {}
  data:
    pgPassword: ""           # POSTGRES_PASSWORD
    redisPassword: ""        # REDIS_PASSWORD
    jwtSigningKey: ""        # ACTION_TOKEN_HMAC_KEY
    kmsKeyArn: ""            # AES-256-GCM tenant-key KMS alias

# Migration Job: run cmd/sn360-es-migrate up before the Deployment.
# Helm hook-weight ordering ensures migrations finish before pods roll.
migrations:
  enabled: true
  image:
    repository: ghcr.io/kennguy3n/sn360-es-migrate
    tag: ""
    pullPolicy: IfNotPresent
  backoffLimit: 3
  activeDeadlineSeconds: 600

# Bundled NATS JetStream dependency. Disable when an external NATS
# cluster is already deployed in the namespace.
nats:
  enabled: true
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
  natsBox:
    enabled: false

# ServiceMonitor for Prometheus Operator. Disable when scraping is done
# via classic annotation-driven discovery.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

# Role-split deployment topology.
#
# When `enabled: true`, the chart emits one Deployment + Service +
# (optional) HPA per role declared under `roles`, each running the
# same image with a different `--role` flag. This decouples HTTP
# request handling from NATS consumer loops from periodic workers,
# which solves the noisy-neighbour failure mode the code review
# identified: a slow Tier-2 SLM call on a consumer pod can no
# longer stall HTTP request handling.
#
# When `enabled: false` (default), the chart emits the historical
# single-binary Deployment running `--role=all`, identical to the
# pre-split topology.
#
# Subsystem ownership boundaries (matched by the code's
# Role.RunsConsumers / Role.RunsWorkers / Role.ServesAPI predicates):
#   api       — HTTP listener + /v1/* business routes. Behind HPA
#               on request CPU.
#   consumers — NATS consumer loops (ingestion poller, push
#               subscription setup + renewal). Scales on
#               event_lag_seconds via KEDA when keda.enabled=true.
#   workers   — periodic workers (relationship, vendor, cleanup,
#               directory sync, partition maintenance). Singleton
#               or low-replica; relies on the Redis distributed
#               lock for leader election when replicaCount > 1.
roleSplit:
  enabled: false
  roles:
    api:
      replicaCount: 2
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 512Mi
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 20
        targetCPUUtilizationPercentage: 70
      podAnnotations: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    consumers:
      replicaCount: 2
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 1
          memory: 768Mi
      # autoscaling.enabled here applies the CPU-driven HPA. When
      # keda.enabled=true the chart emits a KEDA ScaledObject on
      # event_lag_seconds INSTEAD and the HPA block is ignored.
      # See `keda` section below.
      autoscaling:
        enabled: false
        minReplicas: 2
        maxReplicas: 20
        targetCPUUtilizationPercentage: 70
      podAnnotations: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    workers:
      # Workers default to a single replica because every job in
      # this role holds the Redis distributed lock; running N
      # replicas just means N-1 of them sleep at the lock. Bump
      # to >1 only if you want hot-standby failover for the
      # periodic schedules.
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          cpu: 500m
          memory: 512Mi
      autoscaling:
        enabled: false
      podAnnotations: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}

# KEDA-driven autoscaling for the consumers role.
#
# When enabled, the chart emits a ScaledObject that scales the
# consumers Deployment by NATS JetStream consumer lag (primary)
# plus a Prometheus `event_lag_seconds` stuck-consumer safety net
# (secondary). CPU is a poor signal for consumer scaling — a
# consumer can be CPU-idle while NATS lag piles up (waiting on
# Tier-2 SLM latency, slow downstream sinks, etc.). Message-count
# lag is the actual capacity-demand signal and is what the
# 5,000-tenant roadmap specifies; the seconds-based Prometheus
# trigger catches the orthogonal "small backlog of long-stuck
# messages" failure mode that pure message-count lag misses.
#
# KEDA evaluates both triggers independently and scales to
# `max(replicas-each-trigger-would-produce)`, so the two are
# additive rather than conflicting.
#
# REQUIREMENTS:
#   - KEDA operator installed in the cluster
#     (helm install keda kedacore/keda -n keda)
#   - NATS monitoring endpoint reachable from KEDA at
#     `consumers.nats.monitoringAddress` (defaults to the
#     bundled nats chart's :8222 monitoring port)
#   - For the secondary Prometheus trigger: Prometheus
#     reachable from KEDA at `prometheusServerAddress`, and the
#     `event_lag_seconds` metric exported by the consumer loop
#     (registered in pkg/telemetry; see the consumer-loop
#     observer in pkg/events/nats/consumer.go). To disable the
#     Prometheus trigger entirely (NATS-only scaling), set
#     `consumers.prometheusEnabled: false`.
keda:
  enabled: false
  # Only applies when roleSplit.enabled=true; meaningless on the
  # monolith topology because the API + workers would scale
  # alongside the consumers and amplify the noisy-neighbour cost.
  consumers:
    pollingInterval: 30
    cooldownPeriod: 300
    minReplicaCount: 2
    maxReplicaCount: 20

    # ---- Primary trigger: NATS JetStream consumer lag ----
    # Scales by `num_pending` on the `evaluate-svc` durable
    # consumer of the `ES_EVALUATE` stream — the canonical
    # capacity-demand signal per roadmap Task 6.
    nats:
      # The HTTP monitoring endpoint of the NATS server (the
      # `/jsz?consumers=true` route lives here). The bundled
      # nats chart exposes 8222 on the `<release>-nats` service
      # by default; override when NATS lives outside the cluster
      # or under a custom service name.
      monitoringAddress: "http://{{ .Release.Name }}-nats:8222"
      # The NATS account that owns the stream. Default account
      # `$G` is what the chart's bundled NATS uses when no
      # explicit accounts are configured. Override only if you
      # provision multi-account NATS.
      account: "$G"
      stream: "ES_EVALUATE"
      consumer: "evaluate-svc"
      # The per-replica target — KEDA computes
      # `desired_replicas = ceil(num_pending / lagThresholdMessages)`.
      # 1000 means "every additional 1 000 pending msgs adds one
      # consumer replica, up to maxReplicaCount". Matches the
      # roadmap's "Scale up threshold: lag > 1000 messages".
      lagThresholdMessages: 1000
      # The activation/floor threshold. With minReplicaCount=2
      # the consumers never scale to zero, so this primarily
      # governs the cooldown floor — once lag drops below 100
      # the scaler treats the consumer as "drained" and the
      # cooldownPeriod countdown to scaledown can start.
      # Matches the roadmap's "scale down: lag < 100".
      activationLagThresholdMessages: 100
      # Set to "true" if the NATS monitoring endpoint is HTTPS.
      useHTTPS: false

    # ---- Secondary trigger: Prometheus stuck-consumer signal ----
    # Set to false to disable (NATS-only scaling).
    prometheusEnabled: true
    prometheusServerAddress: "http://prometheus-server.monitoring.svc:80"
    # The threshold is the lag value at which one additional
    # replica is provisioned (KEDA's "averageValue" semantics).
    # 5s means "every additional 5 seconds of oldest-pending
    # message age adds one consumer replica, up to
    # maxReplicaCount". Tune downward for lower-latency SLOs.
    lagThresholdSeconds: 5
    query: |
      max(
        event_lag_seconds{component="consumer", subject=~"es\\..+"}
      )

# PgBouncer sidecar for connection pooling.
#
# When enabled, each application pod (api / consumers / workers,
# or the monolith) gets a PgBouncer sidecar listening on 127.0.0.1
# and the app's PG_HOST is rewritten to that loopback address.
# This collapses the per-pod connection count from
# `pool_max_idle * pod_replicas` down to `pgbouncer.maxClientConn`
# at the Postgres server, which is the single biggest lever for
# sustainable database connection budgets at 1000s of tenants.
#
# REQUIREMENTS:
#   - The application's PG_HOST resolves to the in-pod PgBouncer
#     (the chart sets PG_HOST=127.0.0.1, PG_PORT=6432 automatically
#     when enabled).
#   - The actual Postgres host is set under `pgbouncer.upstream`.
pgbouncer:
  enabled: false
  image:
    repository: edoburu/pgbouncer
    tag: "1.23.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
  # The Postgres host the bouncer connects to upstream. Leave
  # empty to inherit from `config.pgHost`.
  upstream:
    host: ""
    port: 5432
    # `transaction` pooling is the right choice for sn360-es —
    # the application uses short-lived transactions and does
    # not rely on session-pinned state (no SET LOCAL, no
    # prepared statements scoped to a session).
    poolMode: transaction
    maxClientConn: 200
    defaultPoolSize: 25
    reservePoolSize: 5
    serverIdleTimeout: 600
    serverLifetime: 3600
  labels: {}

# Optional periodic workers that are NOT started by default in
# every deployment. The Go process gates each on the matching
# environment variable (see internal/config/pipeline.go); the
# chart-level toggles below are consumed only by the PrometheusRule
# template so the catch-all "worker stalled" alert does not fire a
# false page when the worker was never configured to run.
#
# When you enable a worker here, also set the corresponding
# WORKER_*_ENABLED=true on the workers pod (via env, secret, or
# config map) so the Go process actually starts it.
worker:
  intel:
    # Set to true ONLY when WORKER_INTEL_ENABLED=true is also set
    # on the workers pod. If the chart enables the alert but the
    # Go process never starts the worker, the absent_over_time
    # leg will page critical 30 minutes after boot.
    enabled: false

# PrometheusRule for autonomous-ops alerting. Emits a PrometheusRule
# resource grouping the alerts the AI agent in
# `internal/service/agent/alerts/` routes off of. The rules reference
# real metric names emitted by `pkg/telemetry/metrics.go` so a
# production deployment gets a working alert surface out of the box.
#
# Default-on so chart consumers don't silently ship without alerts.
# Disable explicitly if alerts are managed elsewhere (e.g. a central
# org-wide PrometheusRule CRD set).
prometheusRule:
  enabled: true
  # Extra labels merged onto the PrometheusRule's metadata.labels so
  # the rule matches the cluster's Prometheus instance ruleSelector.
  labels: {}

# Used by PrometheusRule annotations to build runbook URLs. Override
# when forking the repo so runbook links resolve correctly.
gitOwnerRepo: "kennguy3n/sn360-es"
