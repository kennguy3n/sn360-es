apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn360-es-llm
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-llm
    app.kubernetes.io/component: tier2-inference
    app.kubernetes.io/part-of: sn360-es
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # The PVC below is ReadWriteOnce and HPA is pinned to replicas=1
  # (see hpa.yaml). A rolling update with maxSurge>=1 would try to
  # bring up a second pod before the old one terminates and the new
  # pod would block in ContainerCreating waiting for the RWO volume
  # to detach — every rollout would deadlock until
  # progressDeadlineSeconds (default 600s) before succeeding. Use
  # Recreate so the old pod is torn down first; this accepts a brief
  # outage per deploy as the cost of the RWO + replicas=1 lock.
  # Lifts naturally to RollingUpdate once the StatefulSet-with-per-
  # pod-PVC follow-up lands (or we move to an RWX storage class).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sn360-es-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sn360-es-llm
        app.kubernetes.io/component: tier2-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9000"
    spec:
      serviceAccountName: sn360-es-llm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      # Ternary-Bonsai-8B Q2_0 is ~3GB and runs on CPU — schedule onto
      # compute-optimised nodes when available, and spread replicas
      # across hosts so a single node failure cannot black-hole Tier 2.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["c6i.xlarge", "c6i.2xlarge", "c7i.xlarge", "c7i.2xlarge"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sn360-es-llm
      volumes:
        # PVC for the GGUF weights — ~3GB, so the download persists
        # across pod restarts. The init container writes into this PVC;
        # the main container mounts it read-only.
        - name: models
          persistentVolumeClaim:
            claimName: sn360-es-llm-models
        # llama-server writes nothing to disk at runtime apart from
        # stderr logs, but readOnlyRootFilesystem still needs writable
        # tmpfs scratch space for libcurl / glibc.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Scratch tmpfs for the download-model init container. curl on
        # Alpine writes resolver / CA cache files under /tmp when
        # readOnlyRootFilesystem is set on the container.
        - name: init-tmp
          emptyDir:
            sizeLimit: 16Mi
        # download-model.sh is mounted from a ConfigMap so the URL or
        # auth flags can be patched without rebuilding the init image.
        # Build the ConfigMap from deployments/llm/download-model.sh in
        # the real overlay (kustomize / helm).
        - name: download-script
          configMap:
            name: sn360-es-llm-download-script
            # 0755 is YAML 1.1 octal. `0o755` (YAML 1.2 / Go-style) only
            # parses on kubectl ≥ 1.29 / sigs.k8s.io/yaml ≥ v1.4.0;
            # older kubectl / helm / argocd built on yaml.v2 treat
            # `0o755` as the string "0o755" and the API server rejects
            # the manifest with `cannot convert string to int32`. Stick
            # with the universally-supported form.
            defaultMode: 0755
      initContainers:
        # Fetches Ternary-Bonsai-8B-Q2_0.gguf from HuggingFace on first
        # boot. Idempotent: skips the download when a non-zero file is
        # already present on the PVC, so pod restarts are cheap.
        - name: download-model
          image: curlimages/curl:8.20.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/download-model.sh"]
          env:
            - name: MODEL_URL
              value: https://huggingface.co/prism-ml/Ternary-Bonsai-8B-gguf/resolve/main/Ternary-Bonsai-8B-Q2_0.gguf
            - name: MODEL_DIR
              value: /models
            - name: MODEL_FILE
              value: Ternary-Bonsai-8B-Q2_0.gguf
            # Optional HuggingFace token for gated mirrors. Wire to a
            # Secret in production overlays; left blank for the public
            # prism-ml repository.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sn360-es-llm-hf
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: download-script
              mountPath: /scripts
              readOnly: true
            # readOnlyRootFilesystem: true below blocks every write
            # outside an explicitly-mounted volume. curl's libcurl /
            # NSS / CA-bundle code paths can scratch into /tmp
            # (resolver cache, CA hash dir, multipart spool); without
            # a writable /tmp the download silently fails on some
            # base images. Give the init container its own tmpfs
            # scratch volume — separate from the main container's
            # `tmp` volume so the two pods can't trample each other.
            - name: init-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop: ["ALL"]
      containers:
        - name: llm
          image: ghcr.io/kennguy3n/sn360-es-llm:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/Ternary-Bonsai-8B-Q2_0.gguf"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "4"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
            # llama-server natively exposes /v1/chat/completions when
            # the OpenAI compatibility layer is enabled (default in
            # recent kennguy3n/llama.cpp builds).
            - "--chat-template"
            - "chatml"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: LLAMA_LOG_COLORS
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Loading a 3GB GGUF and warming the KV cache can take 30-60s
          # on a cold node — use a generous startup probe so a slow
          # mmap doesn't trip the liveness probe.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sn360-es-llm
  namespace: sn360-es
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sn360-es-llm-models
  namespace: sn360-es
spec:
  # The download-model init container WRITES the ~3GB GGUF into this
  # PVC; the main llama-server container then mounts it `readOnly:
  # true`. The PVC itself must therefore be a writable mode at the
  # storage class level. ReadOnlyMany is rejected at admission by
  # most CSI drivers (or silently coerced to a read-only mount, in
  # which case `curl -o` exits with EROFS and the pod never starts).
  #
  # ReadWriteOnce is the highest-portability choice and works on
  # every CSI provisioner. Caveat: HPA scale-up replicas that land on
  # a different node will fail to attach this PVC; the deliberate
  # follow-up for multi-node scale-up is either:
  #   (a) RWX storage class (EFS / CephFS / Filestore) — swap the
  #       accessMode below to ReadWriteMany; the download happens
  #       once cluster-wide and all pods share the same PVC, or
  #   (b) StatefulSet with a per-pod PVC template — each pod gets its
  #       own PVC and downloads the GGUF once per pod ever (cheap on
  #       restart, expensive on first scale-up).
  # For now we lock to RWO + replicas=1 with HPA tuned to keep us
  # there until the StatefulSet/RWX follow-up lands.
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
  storageClassName: standard
