apiVersion: apps/v1
kind: Deployment
metadata:
  name: sn360-es-llm
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-llm
    app.kubernetes.io/component: tier2-inference
    app.kubernetes.io/part-of: sn360-es
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sn360-es-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sn360-es-llm
        app.kubernetes.io/component: tier2-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9000"
    spec:
      serviceAccountName: sn360-es-llm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      # Ternary-Bonsai-8B Q2_0 is ~3GB and runs on CPU — schedule onto
      # compute-optimised nodes when available, and spread replicas
      # across hosts so a single node failure cannot black-hole Tier 2.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["c6i.xlarge", "c6i.2xlarge", "c7i.xlarge", "c7i.2xlarge"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sn360-es-llm
      volumes:
        # PVC for the GGUF weights — ~3GB, so the download persists
        # across pod restarts. The init container writes into this PVC;
        # the main container mounts it read-only.
        - name: models
          persistentVolumeClaim:
            claimName: sn360-es-llm-models
        # llama-server writes nothing to disk at runtime apart from
        # stderr logs, but readOnlyRootFilesystem still needs writable
        # tmpfs scratch space for libcurl / glibc.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # download-model.sh is mounted from a ConfigMap so the URL or
        # auth flags can be patched without rebuilding the init image.
        # Build the ConfigMap from deployments/llm/download-model.sh in
        # the real overlay (kustomize / helm).
        - name: download-script
          configMap:
            name: sn360-es-llm-download-script
            defaultMode: 0o755
      initContainers:
        # Fetches Ternary-Bonsai-8B-Q2_0.gguf from HuggingFace on first
        # boot. Idempotent: skips the download when a non-zero file is
        # already present on the PVC, so pod restarts are cheap.
        - name: download-model
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/download-model.sh"]
          env:
            - name: MODEL_URL
              value: https://huggingface.co/prism-ml/Ternary-Bonsai-8B-gguf/resolve/main/Ternary-Bonsai-8B-Q2_0.gguf
            - name: MODEL_DIR
              value: /models
            - name: MODEL_FILE
              value: Ternary-Bonsai-8B-Q2_0.gguf
            # Optional HuggingFace token for gated mirrors. Wire to a
            # Secret in production overlays; left blank for the public
            # prism-ml repository.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sn360-es-llm-hf
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: download-script
              mountPath: /scripts
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop: ["ALL"]
      containers:
        - name: llm
          image: ghcr.io/kennguy3n/sn360-es-llm:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/Ternary-Bonsai-8B-Q2_0.gguf"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "4"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
            # llama-server natively exposes /v1/chat/completions when
            # the OpenAI compatibility layer is enabled (default in
            # recent kennguy3n/llama.cpp builds).
            - "--chat-template"
            - "chatml"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: LLAMA_LOG_COLORS
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Loading a 3GB GGUF and warming the KV cache can take 30-60s
          # on a cold node — use a generous startup probe so a slow
          # mmap doesn't trip the liveness probe.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sn360-es-llm
  namespace: sn360-es
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sn360-es-llm-models
  namespace: sn360-es
spec:
  # Multiple replicas mount the same GGUF read-only; if the storage
  # class doesn't support ReadOnlyMany, switch to ReadWriteOnce and
  # accept that scale-up replicas re-download once per node.
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 8Gi
  storageClassName: standard
