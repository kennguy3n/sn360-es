# MIGRATION NOTE (Deployment -> StatefulSet): this workload was
# previously a Deployment named `sn360-es-llm` backed by one shared PVC
# named `sn360-es-llm-models`. A kind change orphans BOTH the old
# Deployment object and that PVC — neither is reclaimed automatically
# when the workload referencing it changes kind. After rollout, once the
# new per-pod PVCs are bound and serving, remove both orphans:
#   kubectl -n sn360-es delete deployment sn360-es-llm
#   kubectl -n sn360-es delete pvc sn360-es-llm-models
# (The new per-pod claims are models-sn360-es-llm-<ordinal>; do NOT
# delete those.)
#
# These llm manifests are applied raw (kubectl/kustomize), not via the
# Helm chart the ArgoCD apps track, so `kubectl apply` will leave the old
# Deployment Running alongside the new StatefulSet until you delete it.
# If you instead wire these into a GitOps app: an app with automated
# prune (the dev/qa/uat pattern) removes the old Deployment on sync; a
# manual-sync app with no automated prune (the prod pattern) needs an
# explicit `argocd app sync <app> --prune`. See docs/index.md
# "Deployment" for the runbook entry.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sn360-es-llm
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-llm
    app.kubernetes.io/component: tier2-inference
    app.kubernetes.io/part-of: sn360-es
spec:
  # Tier-2 LLM inference is now a StatefulSet so each replica gets its
  # OWN PVC from volumeClaimTemplates (models-sn360-es-llm-<ordinal>)
  # instead of all replicas contending for one ReadWriteOnce PVC. That
  # was the constraint that previously pinned the HPA to replicas=1: a
  # scale-up pod landing on a second node could not attach the shared
  # RWO volume and would crash-loop with a Multi-Attach error. With a
  # per-pod PVC the HPA can safely scale to maxReplicas=2 (see
  # hpa.yaml); each new pod downloads the GGUF once via its init
  # container (cheap on restart, paid once per pod on first scale-up).
  serviceName: sn360-es-llm-headless
  replicas: 1
  revisionHistoryLimit: 5
  # RollingUpdate is safe now that each pod owns its PVC: a new pod no
  # longer has to wait for a shared RWO volume to detach from the old
  # one, so rollouts no longer deadlock the way they would on a
  # Deployment+RWO. StatefulSet rolling updates replace pods in
  # reverse-ordinal order, one at a time, respecting readiness.
  updateStrategy:
    type: RollingUpdate
  # Parallel start so a scale-up from 1->2 brings the new replica up
  # immediately rather than waiting for lower ordinals to be Ready
  # first; ordinals are independent here (no clustering between pods).
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: sn360-es-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sn360-es-llm
        app.kubernetes.io/component: tier2-inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9000"
    spec:
      serviceAccountName: sn360-es-llm
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      # Ternary-Bonsai-8B Q2_0 is ~3GB and runs on CPU — schedule onto
      # compute-optimised nodes when available, and spread replicas
      # across hosts so a single node failure cannot black-hole Tier 2.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values: ["c6i.xlarge", "c6i.2xlarge", "c7i.xlarge", "c7i.2xlarge"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sn360-es-llm
      volumes:
        # NOTE: the `models` volume is no longer declared here — it is
        # provided per-pod by volumeClaimTemplates below, which the
        # StatefulSet controller binds as a dedicated PVC for each
        # replica and mounts under the same `models` name. The init
        # container writes the GGUF into it; the main container mounts
        # it read-only (see volumeMounts).
        #
        # llama-server writes nothing to disk at runtime apart from
        # stderr logs, but readOnlyRootFilesystem still needs writable
        # tmpfs scratch space for libcurl / glibc.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Scratch tmpfs for the download-model init container. curl on
        # Alpine writes resolver / CA cache files under /tmp when
        # readOnlyRootFilesystem is set on the container.
        - name: init-tmp
          emptyDir:
            sizeLimit: 16Mi
        # download-model.sh is mounted from a ConfigMap so the URL or
        # auth flags can be patched without rebuilding the init image.
        # Build the ConfigMap from deployments/llm/download-model.sh in
        # the real overlay (kustomize / helm).
        - name: download-script
          configMap:
            name: sn360-es-llm-download-script
            # 0755 is YAML 1.1 octal. `0o755` (YAML 1.2 / Go-style) only
            # parses on kubectl ≥ 1.29 / sigs.k8s.io/yaml ≥ v1.4.0;
            # older kubectl / helm / argocd built on yaml.v2 treat
            # `0o755` as the string "0o755" and the API server rejects
            # the manifest with `cannot convert string to int32`. Stick
            # with the universally-supported form.
            defaultMode: 0755
      initContainers:
        # Fetches Ternary-Bonsai-8B-Q2_0.gguf from HuggingFace on first
        # boot. Idempotent: skips the download when a non-zero file is
        # already present on the PVC, so pod restarts are cheap.
        - name: download-model
          image: curlimages/curl:8.20.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/download-model.sh"]
          env:
            - name: MODEL_URL
              value: https://huggingface.co/prism-ml/Ternary-Bonsai-8B-gguf/resolve/main/Ternary-Bonsai-8B-Q2_0.gguf
            - name: MODEL_DIR
              value: /models
            - name: MODEL_FILE
              value: Ternary-Bonsai-8B-Q2_0.gguf
            # Optional HuggingFace token for gated mirrors. Wire to a
            # Secret in production overlays; left blank for the public
            # prism-ml repository.
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sn360-es-llm-hf
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "200m"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: download-script
              mountPath: /scripts
              readOnly: true
            # readOnlyRootFilesystem: true below blocks every write
            # outside an explicitly-mounted volume. curl's libcurl /
            # NSS / CA-bundle code paths can scratch into /tmp
            # (resolver cache, CA hash dir, multipart spool); without
            # a writable /tmp the download silently fails on some
            # base images. Give the init container its own tmpfs
            # scratch volume — separate from the main container's
            # `tmp` volume so the two pods can't trample each other.
            - name: init-tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop: ["ALL"]
      containers:
        - name: llm
          image: ghcr.io/kennguy3n/sn360-es-llm:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "/models/Ternary-Bonsai-8B-Q2_0.gguf"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "4"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "9000"
            # llama-server natively exposes /v1/chat/completions when
            # the OpenAI compatibility layer is enabled (default in
            # recent kennguy3n/llama.cpp builds).
            - "--chat-template"
            - "chatml"
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          env:
            - name: LLAMA_LOG_COLORS
              value: "0"
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Loading a 3GB GGUF and warming the KV cache can take 30-60s
          # on a cold node — use a generous startup probe so a slow
          # mmap doesn't trip the liveness probe.
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  # Per-pod PVC for the GGUF weights (~3GB). The StatefulSet
  # controller provisions one PVC per replica named
  # models-sn360-es-llm-<ordinal>; the download-model init container
  # WRITES the GGUF into it and the main llama-server container mounts
  # it readOnly. ReadWriteOnce is correct here precisely BECAUSE each
  # pod has its own volume — there is no cross-pod contention, so the
  # Multi-Attach failure mode that forced replicas=1 on the old
  # Deployment+shared-PVC arrangement cannot occur. PVCs created from
  # this template are NOT garbage-collected when the StatefulSet
  # scales down; that is intentional, so a scale-up back to a higher
  # ordinal reuses the already-downloaded weights instead of paying
  # the HuggingFace fetch again.
  volumeClaimTemplates:
    - metadata:
        name: models
        labels:
          app.kubernetes.io/name: sn360-es-llm
          app.kubernetes.io/part-of: sn360-es
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
        storageClassName: standard
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sn360-es-llm
  namespace: sn360-es
