apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sn360-es-llm
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-llm
    app.kubernetes.io/part-of: sn360-es
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sn360-es-llm
  # Ternary-Bonsai-8B Q2_0 on CPU is ~2-5s per request; aggressive
  # scale-up would normally keep the Tier 2 queue from blocking the
  # evaluate pipeline.
  #
  # However: the deployment's PVC is currently ReadWriteOnce (see
  # deployments/llm/deployment.yaml:230 and the comment block above
  # it). RWO can only be attached by pods on a single node at a
  # time, so any HPA scale-up that lands a replica on a second node
  # would crash-loop with `Multi-Attach error` and turn a load spike
  # into an outage rather than a scale-up.
  #
  # We therefore pin replicas to 1 here. The CPU / memory / queue
  # metrics below stay declared so the eventual scaling intent is
  # documented at the manifest level — once the StatefulSet-with-
  # per-pod-PVC follow-up lands (or we move to an RWX storage class
  # like EFS / CephFS / Filestore) we just lift these caps and the
  # behaviour block underneath already does the right thing.
  minReplicas: 1
  maxReplicas: 1
  behavior:
    scaleDown:
      # llama-server takes 30-60s to warm up on a cold node, so be slow
      # to scale down — we'd rather pay for one idle replica than cause
      # a cold-start storm on the next burst.
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: queue depth on the Tier 2 NATS consumer that feeds
    # this LLM. The Prometheus adapter must surface this as
    # `external.metrics.k8s.io/v1beta1` for this block to activate.
    - type: External
      external:
        metric:
          name: nats_consumer_pending_messages
          selector:
            matchLabels:
              consumer: es-evaluate-tier2
              stream: ES_EVALUATE
        target:
          type: AverageValue
          averageValue: "10"
