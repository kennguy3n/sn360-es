apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sn360-es-llm
  namespace: sn360-es
  labels:
    app.kubernetes.io/name: sn360-es-llm
    app.kubernetes.io/part-of: sn360-es
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: sn360-es-llm
  # Ternary-Bonsai-8B Q2_0 on CPU is ~2-5s per request; a deep Tier-2
  # backlog otherwise blocks the evaluate pipeline, so we scale up on
  # queue depth.
  #
  # The Multi-Attach constraint that previously pinned this to
  # replicas=1 is gone: sn360-es-llm is now a StatefulSet whose
  # volumeClaimTemplates give each pod its OWN ReadWriteOnce PVC (see
  # deployments/llm/deployment.yaml), so a second replica no longer
  # contends for a shared RWO volume. We therefore allow scale-up to
  # maxReplicas=2 — Tier 2 only handles ~10-20% of traffic, so two
  # replicas is ample headroom while keeping the GPU/CPU bill bounded.
  minReplicas: 1
  maxReplicas: 2
  behavior:
    scaleDown:
      # llama-server takes 30-60s to warm up on a cold node, so be slow
      # to scale down — we'd rather pay for one idle replica than cause
      # a cold-start storm on the next burst.
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metric: queue depth on the Tier 2 NATS consumer that feeds
    # this LLM. The Prometheus adapter must surface this as
    # `external.metrics.k8s.io/v1beta1` for this block to activate.
    #
    # averageValue "50" encodes the scale-up target: the HPA brings up
    # the second replica to keep the mean Tier-2 pending count per pod
    # at ~50. Tier 2 is slower than the encoder, so this threshold is
    # lower than the encoder's 100. The 600s scaleDown stabilization
    # above keeps us from tearing the second replica down (and paying a
    # 30-60s cold start on the next burst) until the backlog has been
    # drained for the full window.
    - type: External
      external:
        metric:
          name: nats_consumer_pending_messages
          selector:
            matchLabels:
              consumer: es-evaluate-tier2
              stream: ES_EVALUATE
        target:
          type: AverageValue
          averageValue: "50"
