services:
  nats:
    image: nats:2.10-alpine
    container_name: sn360es-nats
    command:
      - "-js"
      - "-sd"
      - "/data"
      - "-m"
      - "8222"
    # Bind to the loopback interface so the dev stack is not
    # accessible from other machines on the LAN. Operators who need
    # remote access should change this explicitly and add auth.
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data

  redis:
    image: redis:7-alpine
    container_name: sn360es-redis
    # The dev password is intentionally not a secret — it gates
    # accidental connections from cohabiting containers/tools on the
    # same loopback, not real attackers. Match REDIS_PASSWORD in
    # .env.example so `make run` works out of the box.
    command:
      - "redis-server"
      - "--save"
      - "60"
      - "1"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "sn360es-dev"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: sn360es-postgres
    environment:
      POSTGRES_USER: sn360es
      POSTGRES_PASSWORD: sn360es
      POSTGRES_DB: sn360es
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rspamd:
    image: rspamd/rspamd:3.14
    container_name: sn360es-rspamd
    ports:
      - "127.0.0.1:11333:11333"
      - "127.0.0.1:11334:11334"

  unbound:
    image: mvance/unbound:latest
    container_name: sn360es-unbound
    ports:
      - "127.0.0.1:5335:53/udp"

  # ClamAV is used by the attachment pre-screening dev workflow.
  # It exposes the clamd daemon on port 3310; the freshclam mirror is
  # not exposed to the host so updates remain inside the container.
  # First boot pulls signatures and may take a few minutes before the
  # service becomes healthy.
  clamav:
    image: clamav/clamav:1.4
    container_name: sn360es-clamav
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  nats-data:
  redis-data:
  postgres-data:
  clamav-data:
