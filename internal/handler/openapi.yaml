openapi: 3.1.0
info:
  title: SN360-ES Service API
  version: "v2.0"
  description: |
    REST surface for the SN360-ES (Email Security) control plane.

    The API is divided into:
      * `/v1/banner/*` — one-click user feedback from rendered banners
      * `/v1/quarantine/*` — quarantine release approval workflow
      * `/v1/education/*` — micro-lesson and simulation tracking
      * `/v1/escalation/*` — SOC escalation ticket handling
      * `/v1/dashboard/*` — aggregated tenant dashboards
      * `/v1/predict/*` — pre-send and pre-open add-in scoring
      * `/v1/onboarding/*` — OAuth consent flow for tenant onboarding

    All request and response bodies are JSON. Authentication is via
    short-lived signed action tokens or tenant API keys depending on the
    endpoint.
  contact:
    name: SN360-ES Maintainers
    url: https://github.com/kennguy3n/sn360-es
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://sn360-es.dev.uney.com
    description: Dev cluster
tags:
  - name: banner
  - name: quarantine
  - name: education
  - name: escalation
  - name: dashboard
  - name: predict
  - name: onboarding
  - name: vendor
  - name: system

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Always returns 200 OK while the process is running.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports readiness as a JSON document with one entry per
        dependency (`nats`, `redis`, `postgres`). Returns 503 when any
        required dependency is unavailable.
      responses:
        "200":
          description: All checks healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      description: |
        Exposes counters / histograms in Prometheus exposition format.
        See `pkg/telemetry/metrics.go` for the canonical instrument
        names.
      responses:
        "200":
          description: Prometheus exposition payload
          content:
            text/plain:
              schema:
                type: string

  /docs:
    get:
      tags: [system]
      summary: Swagger UI
      description: Interactive API explorer served from the embedded OpenAPI document.
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}

  /openapi.yaml:
    get:
      tags: [system]
      summary: OpenAPI document
      description: Raw OpenAPI 3.1 spec used by `/docs`.
      responses:
        "200":
          description: YAML body
          content:
            application/yaml: {}

  /v1/banner/action:
    post:
      tags: [banner]
      summary: Submit one-click banner feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerActionRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerActionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /v1/quarantine/release:
    post:
      tags: [quarantine]
      summary: Release a quarantined message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineReleaseRequest"
      responses:
        "200":
          description: Release outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineReleaseResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/education/lesson/{category}:
    get:
      tags: [education]
      summary: Fetch a micro-lesson
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            description: "One of the SN360-ES risk categories (e.g. LIKELY_PHISHING, BEC_IMPERSONATION, SUSPICIOUS_URL). See README for the full list."
        - in: query
          name: locale
          schema:
            type: string
            default: en
      responses:
        "200":
          description: Lesson body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroLesson"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/escalation/resolve:
    post:
      tags: [escalation]
      summary: Resolve a SOC escalation ticket
      description: |
        Records the SecOps outcome on an existing escalation ticket.
        The caller's tenant is verified against the ticket's TenantID;
        a cross-tenant resolve attempt is indistinguishable from a
        ticket-not-found result — both return 404 with the same
        response body so the endpoint cannot be used to fingerprint
        which ticket IDs belong to another tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationResolveRequest"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationResolveResponse"
        "400":
          description: |
            Client-side input fault. Returned for malformed JSON,
            an unknown outcome value, an oversized request body, or
            a missing ticket_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Missing or invalid authentication. Returned before any
            body parsing so an unauthenticated caller cannot probe
            the request schema by observing 400 vs 401 differentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Ticket not found OR the ticket belongs to a different
            tenant. The two cases return the same status code and
            response body so cross-tenant callers cannot fingerprint
            which ticket IDs exist in another tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The ticket has already been resolved. Re-resolving a
            non-pending ticket is a business-rule conflict, not an
            input fault — the response is 409 (canonical "request
            conflicts with current resource state") so clients can
            distinguish a malformed-payload retry from a state-
            conflict requiring a fresh fetch + re-decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |
            Server-side fault. Returned when a downstream dependency
            fails (Postgres ticket store unreachable, NATS publish
            failure, JSON marshal error). The error body is
            intentionally generic — the diagnostic detail lives in
            the server logs, not on the wire.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/escalation/{ticket_id}:
    get:
      tags: [escalation]
      summary: Fetch an escalation ticket by ID
      description: |
        Returns the structured ticket payload (incident, timeline,
        outcome) for the supplied ticket_id. The caller's tenant is
        verified against the ticket's TenantID — cross-tenant
        accesses return 404, not the ticket, to avoid leaking the
        existence of a ticket from a different tenant.
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema:
            type: string
          description: Ticket identifier returned by the escalation publisher.
      responses:
        "200":
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationTicket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/dashboard/summary:
    get:
      tags: [dashboard]
      summary: Aggregate dashboard for a tenant
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            description: "Time range (`7d`, `24h`, etc.)"
            default: "7d"
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "400":
          $ref: "#/components/responses/Error"

  /v1/predict/recipient:
    post:
      tags: [predict]
      summary: Pre-send recipient risk score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRecipientRequest"
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictRecipientResponse"

  /v1/predict/open:
    post:
      tags: [predict]
      summary: Pre-open URL risk score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictOpenRequest"
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictOpenResponse"

  /v1/onboarding/start:
    get:
      tags: [onboarding]
      summary: Start OAuth consent flow
      description: |
        Generates a redirect URL for the OAuth consent screen. The caller
        should redirect the tenant admin's browser to the returned URL.
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            type: string
            enum: [google_workspace, microsoft_365]
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redirect URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/callback:
    get:
      tags: [onboarding]
      summary: OAuth callback handler
      description: |
        Receives the OAuth callback from the identity provider.
        Validates the state token, exchanges the authorisation code
        for tokens, and triggers the post-consent onboarding pipeline.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Callback processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Error"

  /v1/onboarding/status:
    get:
      tags: [onboarding]
      summary: Onboarding status
      description: |
        Returns the current onboarding status for a tenant, including
        user/group discovery counts and the number of users requiring
        admin review.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/revoke:
    delete:
      tags: [onboarding]
      summary: Revoke onboarding tokens
      description: |
        Revokes stored OAuth tokens for a tenant/provider pair,
        effectively disconnecting the tenant from the identity provider.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: provider
          required: true
          schema:
            type: string
            enum: [google_workspace, microsoft_365]
      responses:
        "200":
          description: Tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        "400":
          $ref: "#/components/responses/Error"

  /v1/vendors:
    get:
      tags: [vendor]
      summary: List vendors
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      tags: [vendor]
      summary: Add a manual vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreateRequest"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}/approve:
    put:
      tags: [vendor]
      summary: Approve a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
      responses:
        "200":
          description: Vendor approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}/revoke:
    put:
      tags: [vendor]
      summary: Revoke a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
      responses:
        "200":
          description: Vendor revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}:
    delete:
      tags: [vendor]
      summary: Delete a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/gws-setup-status:
    get:
      tags: [onboarding]
      summary: GWS domain-wide delegation setup status
      description: |
        Returns step-by-step validation of the GWS domain-wide delegation
        configuration. Checks whether the service account, delegated admin,
        and domain are set, and optionally tests live Directory and Gmail
        API connectivity.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GWSSetupStatus"
        "400":
          $ref: "#/components/responses/Error"

  /v1/org-graph:
    get:
      tags: [directory]
      summary: Get persisted org graph snapshot
      description: |
        Returns the latest org graph snapshot for the given tenant.
        The graph is rebuilt after each directory sync cycle. PII fields
        are stored as hashes, not raw emails.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Org graph snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgGraphSnapshot"
        "404":
          $ref: "#/components/responses/Error"

components:
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, error, skipped]
              error:
                type: string
              latency_ms:
                type: integer

    BannerActionRequest:
      type: object
      required: [token, action]
      properties:
        token:
          type: string
          description: Signed JWT minted when the banner was rendered.
        action:
          type: string
          enum: [report_phishing, mark_safe, trust_sender, ignore]

    BannerActionResponse:
      type: object
      required: [status, action, pseudonymized_message_id]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
        pseudonymized_message_id:
          type: string

    QuarantineReleaseRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        approver_role:
          type: string
          enum: [admin, security_lead, end_user]
        justification:
          type: string

    QuarantineReleaseResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        released_at:
          type: string
          format: date-time

    MicroLesson:
      type: object
      required: [category, locale, title, body]
      properties:
        category:
          type: string
        locale:
          type: string
        title:
          type: string
        body:
          type: string
        cta_url:
          type: string

    EscalationResolveRequest:
      description: |
        Payload for POST /v1/escalation/resolve. Field names + enum
        values are the canonical SOC-outcome vocabulary used by
        `internal/dto.EscalationOutcome`; the handler decodes with
        `DisallowUnknownFields()` so this schema must stay in lock-
        step with the Go struct tags at internal/handler/escalation.go.
      type: object
      required: [ticket_id, outcome]
      properties:
        ticket_id:
          type: string
        resolver_hash:
          type: string
          description: |
            Privacy-hash identifying the SecOps engineer who resolved
            the ticket. Optional in the request; populated by the
            handler from request context if not supplied.
        outcome:
          type: string
          description: |
            SOC verdict on the escalated incident. Drives the feedback
            sink + training pipeline at internal/service/agent/escalation.go.
          enum:
            - confirmed_phishing
            - false_positive
            - requires_hunting
            - closed_no_action
        notes:
          type: string

    EscalationResolveResponse:
      description: |
        Successful resolve responses return the full updated
        EscalationTicket (including timeline, outcome, resolution
        notes). This schema documents the response wrapper kept for
        backward compatibility with first-generation clients; new
        clients should consume EscalationTicket directly.
      type: object
      properties:
        status:
          type: string
        ticket_id:
          type: string

    EscalationTicket:
      type: object
      description: |
        Structured incident record returned by GET
        /v1/escalation/{ticket_id}. Pseudonymised — never carries
        raw subject / sender / body content.
      properties:
        ticket_id:
          type: string
        tenant_id:
          type: string
        created_at:
          type: string
          format: date-time
        reason:
          type: string
          enum: [confirmed_breach, account_compromise, zero_day_attachment, ai_low_confidence, user_requested, ops_alert]
        incident:
          type: object
          properties:
            pseudo_message_id: { type: string }
            tier: { type: string }
            category: { type: string }
            reason: { type: string }
            score: { type: number }
            affected_user_count: { type: integer }
            ai_summary: { type: string }
            indicators:
              type: array
              items: { type: string }
            detected_at: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              occurred_at: { type: string, format: date-time }
              step: { type: string }
              detail: { type: string }
        outcome:
          type: string
          enum: ["", confirmed_phishing, false_positive, requires_hunting, closed_no_action]
        resolved_at:
          type: string
          format: date-time
        resolver_hash:
          type: string
        resolution_notes:
          type: string
      required: [ticket_id, tenant_id, created_at, reason]

    DashboardSummary:
      type: object
      properties:
        tenant_id:
          type: string
        range:
          type: string
        evaluated:
          type: integer
        banner_distribution:
          type: object
          additionalProperties:
            type: integer
        top_categories:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
        resilience_score:
          type: number

    PredictRecipientRequest:
      type: object
      required: [tenant_id, sender, recipients]
      properties:
        tenant_id:
          type: string
        sender:
          type: string
        recipients:
          type: array
          items:
            type: string

    PredictRecipientResponse:
      type: object
      properties:
        risk:
          type: string
          enum: [low, medium, high]
        reason:
          type: string

    PredictOpenRequest:
      type: object
      required: [tenant_id, url]
      properties:
        tenant_id:
          type: string
        url:
          type: string

    PredictOpenResponse:
      type: object
      properties:
        risk:
          type: string
          enum: [low, medium, high]
        verdict:
          type: string

    OnboardingStatus:
      type: object
      properties:
        tenant_id:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, completed]
        users_discovered:
          type: integer
        groups_discovered:
          type: integer
        needs_review_count:
          type: integer

    GWSSetupStatus:
      type: object
      properties:
        service_account_configured:
          type: boolean
        delegated_admin_configured:
          type: boolean
        domain_configured:
          type: boolean
        directory_access_ok:
          type: boolean
        gmail_access_ok:
          type: boolean
        steps_remaining:
          type: array
          items:
            type: string

    Vendor:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        domain:
          type: string
        display_name:
          type: string
        approved:
          type: boolean
        auto_discovered:
          type: boolean
        confidence:
          type: number
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorCreateRequest:
      type: object
      required: [tenant_id, domain]
      properties:
        tenant_id:
          type: string
        domain:
          type: string
        display_name:
          type: string

    OrgGraphSnapshot:
      type: object
      properties:
        tenant_id:
          type: string
        built_at:
          type: string
          format: date-time
        graph:
          type: object
          description: JSON blob of the org graph structure
        high_risk_count:
          type: integer
        department_count:
          type: integer
        employee_count:
          type: integer
        group_count:
          type: integer
