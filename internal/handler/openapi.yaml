openapi: 3.1.0
info:
  title: SN360-ES Service API
  version: "v2.0"
  description: |
    REST surface for the SN360-ES (Email Security) control plane.

    The API is divided into:
      * `/v1/banner/*` — one-click user feedback from rendered banners
      * `/v1/quarantine/*` — quarantine release approval workflow
      * `/v1/education/*` — micro-lesson and simulation tracking
      * `/v1/escalation/*` — SOC escalation ticket handling
      * `/v1/dashboard/*` — aggregated tenant dashboards
      * `/v1/predict/*` — pre-send and pre-open add-in scoring
      * `/v1/onboarding/*` — OAuth consent flow for tenant onboarding

    All request and response bodies are JSON. Authentication is via
    short-lived signed action tokens or tenant API keys depending on the
    endpoint.
  contact:
    name: SN360-ES Maintainers
    url: https://github.com/kennguy3n/sn360-es
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://sn360-es.dev.uney.com
    description: Dev cluster
tags:
  - name: banner
  - name: quarantine
  - name: education
  - name: escalation
  - name: dashboard
  - name: predict
  - name: onboarding
  - name: vendor
  - name: investigation
  - name: webhook-sinks
  - name: system

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      description: Always returns 200 OK while the process is running.
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [system]
      summary: Readiness probe
      description: |
        Reports readiness as a JSON document with one entry per
        dependency (`nats`, `redis`, `postgres`). Returns 503 when any
        required dependency is unavailable.
      responses:
        "200":
          description: All checks healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more checks failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      description: |
        Exposes counters / histograms in Prometheus exposition format.
        See `pkg/telemetry/metrics.go` for the canonical instrument
        names.
      responses:
        "200":
          description: Prometheus exposition payload
          content:
            text/plain:
              schema:
                type: string

  /docs:
    get:
      tags: [system]
      summary: Swagger UI
      description: Interactive API explorer served from the embedded OpenAPI document.
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}

  /openapi.yaml:
    get:
      tags: [system]
      summary: OpenAPI document
      description: Raw OpenAPI 3.1 spec used by `/docs`.
      responses:
        "200":
          description: YAML body
          content:
            application/yaml: {}

  /v1/banner/action:
    post:
      tags: [banner]
      summary: Submit one-click banner feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BannerActionRequest"
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerActionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /v1/quarantine/release:
    post:
      tags: [quarantine]
      summary: Release a quarantined message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarantineReleaseRequest"
      responses:
        "200":
          description: Release outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarantineReleaseResponse"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/education/lesson/{category}:
    get:
      tags: [education]
      summary: Fetch a micro-lesson
      parameters:
        - in: path
          name: category
          required: true
          schema:
            type: string
            description: "One of the SN360-ES risk categories (e.g. LIKELY_PHISHING, BEC_IMPERSONATION, SUSPICIOUS_URL). See README for the full list."
        - in: query
          name: locale
          schema:
            type: string
            default: en
      responses:
        "200":
          description: Lesson body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroLesson"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/escalation/resolve:
    post:
      tags: [escalation]
      summary: Resolve a SOC escalation ticket
      description: |
        Records the SecOps outcome on an existing escalation ticket.
        The caller's tenant is verified against the ticket's TenantID;
        a cross-tenant resolve attempt is indistinguishable from a
        ticket-not-found result — both return 404 with the same
        response body so the endpoint cannot be used to fingerprint
        which ticket IDs belong to another tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationResolveRequest"
      responses:
        "200":
          description: |
            Resolved. Returns the full updated EscalationTicket so
            clients can render the post-resolve state (outcome,
            resolution notes, resolved_at timestamp, complete
            timeline) without a follow-up GET. The legacy
            EscalationResolveResponse wrapper ({status, ticket_id})
            is retained in this spec for documentation only; the
            handler has always returned a full ticket, so
            generated clients should consume EscalationTicket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationTicket"
        "400":
          description: |
            Client-side input fault. Returned for malformed JSON,
            an unknown outcome value, an oversized request body, or
            a missing ticket_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Missing or invalid authentication. Returned before any
            body parsing so an unauthenticated caller cannot probe
            the request schema by observing 400 vs 401 differentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            Ticket not found OR the ticket belongs to a different
            tenant. The two cases return the same status code and
            response body so cross-tenant callers cannot fingerprint
            which ticket IDs exist in another tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The ticket has already been resolved. Re-resolving a
            non-pending ticket is a business-rule conflict, not an
            input fault — the response is 409 (canonical "request
            conflicts with current resource state") so clients can
            distinguish a malformed-payload retry from a state-
            conflict requiring a fresh fetch + re-decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |
            Server-side fault. Returned when a downstream dependency
            fails (Postgres ticket store unreachable, NATS publish
            failure, JSON marshal error). The error body is
            intentionally generic — the diagnostic detail lives in
            the server logs, not on the wire.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/escalation/{ticket_id}:
    get:
      tags: [escalation]
      summary: Fetch an escalation ticket by ID
      description: |
        Returns the structured ticket payload (incident, timeline,
        outcome) for the supplied ticket_id. The caller's tenant is
        verified against the ticket's TenantID — cross-tenant
        accesses return 404, not the ticket, to avoid leaking the
        existence of a ticket from a different tenant.
      parameters:
        - in: path
          name: ticket_id
          required: true
          schema:
            type: string
          description: Ticket identifier returned by the escalation publisher.
      responses:
        "200":
          description: Ticket found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationTicket"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/investigation/message/{pseudo_id}:
    get:
      tags: [investigation]
      summary: Per-message investigation trail
      description: |
        WS-3b operator pivot from an incident / dashboard into the
        message-level verdict context. Returns the persisted
        EvaluationResult for (tenant, pseudo_message_id) plus, when
        the result carries pseudonymised participant hashes, the
        CommunicationHistory row for the (sender, recipient) pair.

        Tenant isolation: cross-tenant accesses return 404 with an
        identical response body to the genuine "not found" case so
        the response surface cannot be used to fingerprint which
        message IDs exist in another tenant. The caller's tenant
        comes from the verified JWT claim — the pseudo_message_id
        path parameter is the lookup key, never the tenant ID.
      parameters:
        - in: path
          name: pseudo_id
          required: true
          schema:
            type: string
          description: |
            Pseudonymised message identifier the evaluator stamped on
            the verdict (BYTEA message_id_hash on
            evaluation_results, rendered as the original wire string
            by the writer). Operators copy this from the incident
            detail view; it is opaque to the SOC.
      responses:
        "200":
          description: Message trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageTrailResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/investigation/sender/{sender_hash}:
    get:
      tags: [investigation]
      summary: Per-sender investigation trail
      description: |
        WS-3b operator pivot from a verdict / dashboard into the
        sender-level activity pattern. Returns the recent
        evaluation verdicts for (tenant, sender_hash), the recipient
        fan-out across the tenant, and a small aggregate envelope
        for the dashboard headline metrics.

        sender_hash is base64url-encoded with no padding (the
        canonical wire shape the dashboard emits — URL-safe). The
        endpoint additionally accepts base64url-with-padding,
        base64-standard-no-padding, and base64-standard-with-padding
        as defense-in-depth fallbacks; '/' is rejected at the path
        validation gate so standard-encoded inputs containing '/'
        must be reshaped to url-safe before transit.

        The look-back is bounded server-side: the optional
        `since_hours` parameter caps at 720 (30 days), matching the
        rolling Count30d window on communication_histories.
      parameters:
        - in: path
          name: sender_hash
          required: true
          schema:
            type: string
          description: |
            base64url-encoded BYTEA pseudonym derived by the bridge /
            enricher (HashPII(tenantID, lower(trim(address)))). The
            dashboard typically copies this from a verdict detail.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
          description: |
            Cap on the number of verdicts returned. Default 100; the
            repository hard-caps at 500 regardless of the requested
            value, but values above 500 are rejected at the handler
            with 400 so the caller can correct the typo.
        - in: query
          name: since_hours
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 720
          description: |
            Aggregation look-back in hours. Default 720 (30 days).
            Values outside [1, 720] return 400.
      responses:
        "200":
          description: Sender trail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SenderTrailResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dashboard/summary:
    get:
      tags: [dashboard]
      summary: Aggregate dashboard for a tenant
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: range
          schema:
            type: string
            description: "Time range (`7d`, `24h`, etc.)"
            default: "7d"
      responses:
        "200":
          description: Aggregated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "400":
          $ref: "#/components/responses/Error"

  /v1/predict/recipient:
    post:
      tags: [predict]
      summary: Pre-send recipient risk score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictRecipientRequest"
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictRecipientResponse"

  /v1/predict/open:
    post:
      tags: [predict]
      summary: Pre-open URL risk score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictOpenRequest"
      responses:
        "200":
          description: Prediction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictOpenResponse"

  /v1/onboarding/start:
    get:
      tags: [onboarding]
      summary: Start OAuth consent flow
      description: |
        Generates a redirect URL for the OAuth consent screen. The caller
        should redirect the tenant admin's browser to the returned URL.
      parameters:
        - in: query
          name: provider
          required: true
          schema:
            type: string
            enum: [google_workspace, microsoft_365]
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Redirect URL generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirect_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/callback:
    get:
      tags: [onboarding]
      summary: OAuth callback handler
      description: |
        Receives the OAuth callback from the identity provider.
        Validates the state token, exchanges the authorisation code
        for tokens, and triggers the post-consent onboarding pipeline.
      parameters:
        - in: query
          name: state
          required: true
          schema:
            type: string
        - in: query
          name: code
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Callback processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id:
                    type: string
                  provider:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Error"

  /v1/onboarding/status:
    get:
      tags: [onboarding]
      summary: Onboarding status
      description: |
        Returns the current onboarding status for a tenant, including
        user/group discovery counts and the number of users requiring
        admin review.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingStatus"
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/revoke:
    delete:
      tags: [onboarding]
      summary: Revoke onboarding tokens
      description: |
        Revokes stored OAuth tokens for a tenant/provider pair,
        effectively disconnecting the tenant from the identity provider.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
        - in: query
          name: provider
          required: true
          schema:
            type: string
            enum: [google_workspace, microsoft_365]
      responses:
        "200":
          description: Tokens revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
        "400":
          $ref: "#/components/responses/Error"

  /v1/vendors:
    get:
      tags: [vendor]
      summary: List vendors
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      tags: [vendor]
      summary: Add a manual vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCreateRequest"
      responses:
        "201":
          description: Vendor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}/approve:
    put:
      tags: [vendor]
      summary: Approve a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
      responses:
        "200":
          description: Vendor approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}/revoke:
    put:
      tags: [vendor]
      summary: Revoke a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
      responses:
        "200":
          description: Vendor revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          $ref: "#/components/responses/Error"

  /v1/vendors/{domain}:
    delete:
      tags: [vendor]
      summary: Delete a vendor
      parameters:
        - in: path
          name: domain
          required: true
          schema:
            type: string
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vendor deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Error"

  /v1/onboarding/gws-setup-status:
    get:
      tags: [onboarding]
      summary: GWS domain-wide delegation setup status
      description: |
        Returns step-by-step validation of the GWS domain-wide delegation
        configuration. Checks whether the service account, delegated admin,
        and domain are set, and optionally tests live Directory and Gmail
        API connectivity.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GWSSetupStatus"
        "400":
          $ref: "#/components/responses/Error"

  /v1/intel/feeds:
    get:
      tags: [intel]
      summary: List threat-intel feeds (admin only)
      description: |
        Returns every configured intel feed. Requires a JWT with
        `scp=admin_api`.
      responses:
        "200":
          description: Feed list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelFeedList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [intel]
      summary: Register a new threat-intel feed (admin only)
      description: |
        Creates a new feed. The `provider` MUST be one of `urlhaus`,
        `misp`, `stix-taxii`, or `csv`. Requires `scp=admin_api`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelFeedCreate"
      responses:
        "201":
          description: Feed created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelFeed"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/intel/feeds/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [intel]
      summary: Get a single feed by ID (admin only)
      responses:
        "200":
          description: Feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelFeed"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [intel]
      summary: Update a feed (admin only)
      description: |
        Mutates the URL, fetch interval, or enabled flag of an existing
        feed. Fields omitted from the payload are left unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntelFeedPatch"
      responses:
        "200":
          description: Feed updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelFeed"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [intel]
      summary: Delete a feed and all its indicators (admin only)
      description: |
        Cascades to intel_indicators rows owned by this feed.
      responses:
        "204":
          description: Feed deleted
        "404":
          $ref: "#/components/responses/Error"

  /v1/intel/feeds/{id}/refresh:
    post:
      tags: [intel]
      summary: Force-fetch a feed now (admin only)
      description: |
        Runs a single poll outside the worker's normal schedule. The
        same bookkeeping/upsert/alert path as the scheduled loop is
        followed, so a refresh failure still bumps
        `consecutive_failures`. Returns the number of indicators
        inserted or updated by the upsert.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refresh complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelRefreshResponse"
        "404":
          $ref: "#/components/responses/Error"
        "501":
          description: Refresher not wired in this deployment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Upstream feed fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/intel/indicators:
    get:
      tags: [intel]
      summary: Debug lookup by raw indicator (admin only)
      description: |
        Canonicalises and SHA-256-hashes the supplied indicator, then
        returns every intel_indicators row that matched. Used by
        operators to confirm whether an IOC is currently in any feed.
      parameters:
        - in: query
          name: indicator
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntelIndicatorLookup"
        "400":
          $ref: "#/components/responses/Error"

||||||| parent of 7f61d64 ([WS-5B.2] Per-tenant webhook sink for standalone SIEM egress)
  /v1/tenants/{tenant_id}/webhook-sinks:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
    get:
      tags: [webhook-sinks]
      summary: List webhook sinks for the tenant
      description: |
        Returns every non-deleted webhook sink configured for
        the tenant. The plaintext HMAC secret is NEVER included
        in this response — it is shown only once in the create
        reply.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of webhook sinks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSinkListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [webhook-sinks]
      summary: Create a webhook sink
      description: |
        Creates a new sink for the tenant. The server generates a
        32-byte HMAC secret and returns it ONCE in the response
        body (`hmac_secret_b64`). The customer must persist this
        secret on their side — it cannot be retrieved again. The
        ciphertext (envelope-encrypted under the tenant KMS key)
        is what the database stores.

        The `url` MUST be `https://`. Plain HTTP is rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSinkCreateRequest"
      responses:
        "201":
          description: Sink created — HMAC secret returned ONCE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSinkCreateResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenant_id}/webhook-sinks/{sink_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/SinkIDPath"
    get:
      tags: [webhook-sinks]
      summary: Get one webhook sink
      description: |
        Returns the sink's current configuration. The HMAC secret
        is never echoed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sink
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSinkResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [webhook-sinks]
      summary: Update a webhook sink
      description: |
        Update one or more of `url`, `format`, `event_filters`,
        `enabled`. Omitted fields are not touched. Renaming a
        sink is intentionally not exposed — delete + recreate
        instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSinkUpdateRequest"
      responses:
        "200":
          description: Updated sink
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSinkResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [webhook-sinks]
      summary: Soft-delete a webhook sink
      description: |
        Stamps `deleted_at` on the row and flips `enabled=false`.
        The row is preserved for audit/forensic purposes; the
        dispatcher's hot-path partial index stops returning it
        immediately.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenant_id}/webhook-sinks/{sink_id}/test:
    parameters:
      - $ref: "#/components/parameters/TenantIDPath"
      - $ref: "#/components/parameters/SinkIDPath"
    post:
      tags: [webhook-sinks]
      summary: Fire a synthetic test event to the sink
      description: |
        Builds a deterministic synthetic verdict (Tier=Caution,
        Primary=NEWSLETTER, reason=synthetic_test), HMAC-signs it
        under the sink's stored secret, POSTs it to the
        configured URL, and returns the customer endpoint's
        actual HTTP status code + latency. Use this immediately
        after `POST /webhook-sinks` to verify end-to-end
        connectivity.

        The synthetic event carries `X-SN360-Event-Type:
        email.evaluation` so a customer parser exercises the
        same code path it would on a real verdict, but the body
        is flagged with `synthetic_test: 1` so dashboards can
        exclude it from real-traffic metrics.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer endpoint reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSinkTestResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          description: Sink is disabled — enable it first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Dispatcher not wired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/org-graph:
    get:
      tags: [directory]
      summary: Get persisted org graph snapshot
      description: |
        Returns the latest org graph snapshot for the given tenant.
        The graph is rebuilt after each directory sync cycle. PII fields
        are stored as hashes, not raw emails.
      parameters:
        - in: query
          name: tenant_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Org graph snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgGraphSnapshot"
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived signed action token issued by `privacy.JWTIssuer`.
        Webhook-sinks routes require the `role` claim to be `admin`
        and the `tid` claim to match the `{tenant_id}` path
        parameter; mismatches fail closed with 403.

  parameters:
    TenantIDPath:
      in: path
      name: tenant_id
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant UUID. Must match the caller's `tid` claim.
    SinkIDPath:
      in: path
      name: sink_id
      required: true
      schema:
        type: string
        format: uuid
      description: Webhook sink UUID returned by `POST /webhook-sinks`.

  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    WebhookSinkFilters:
      type: object
      description: |
        Per-sink event filters. Unknown JSON keys are preserved
        verbatim on a round-trip so a forward-rolling deployment
        can write filter knobs an older dispatcher ignores
        instead of clobbering them.
      properties:
        min_tier:
          type: string
          description: |
            Lowest `Tier` (Informational < Caution < Warning <
            HighRisk < Blocked) the sink will receive. Empty
            means "all tiers".
          enum:
            - ""
            - Informational
            - Caution
            - Warning
            - HighRisk
            - Blocked
        categories:
          type: array
          description: |
            If non-empty, only verdicts whose `primary` category
            is in this list are published. Empty = no
            restriction.
          items:
            type: string
        rate_limit_per_minute:
          type: integer
          description: |
            Per-sink rate limit override. 0 (or absent) =
            dispatcher default of 100 req/min.
          minimum: 0

    WebhookSinkResponse:
      type: object
      required: [id, tenant_id, name, url, format, event_filters, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          description: Operator-chosen label. Unique per (tenant_id, name).
        url:
          type: string
          format: uri
          description: HTTPS endpoint the dispatcher POSTs to.
        format:
          type: string
          enum: [ecs, cef]
          description: |
            Wire format: `ecs` = Elastic Common Schema 8.11 JSON,
            `cef` = ArcSight Common Event Format v0 (pipe-
            delimited; Splunk HEC + Sentinel Logic Apps accept
            this).
        event_filters:
          $ref: "#/components/schemas/WebhookSinkFilters"
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WebhookSinkListResponse:
      type: object
      required: [sinks]
      properties:
        sinks:
          type: array
          items:
            $ref: "#/components/schemas/WebhookSinkResponse"

    WebhookSinkCreateRequest:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: HTTPS URL. Plain `http://` is rejected.
        format:
          type: string
          enum: [ecs, cef]
          default: ecs
        event_filters:
          $ref: "#/components/schemas/WebhookSinkFilters"
        enabled:
          type: boolean
          default: true

    WebhookSinkCreateResponse:
      allOf:
        - $ref: "#/components/schemas/WebhookSinkResponse"
        - type: object
          required: [hmac_secret_b64]
          properties:
            hmac_secret_b64:
              type: string
              description: |
                The 32-byte HMAC-SHA256 signing secret,
                base64-encoded. **Shown ONCE only.** Subsequent
                GETs and PATCHes do not echo this field. Persist
                it on the customer side to verify the
                `X-SN360-Signature` header on incoming events.

    WebhookSinkUpdateRequest:
      type: object
      description: |
        All fields are optional; omitted fields are not touched.
        Renaming is not supported — delete + recreate instead.
      properties:
        url:
          type: string
          format: uri
        format:
          type: string
          enum: [ecs, cef]
        event_filters:
          $ref: "#/components/schemas/WebhookSinkFilters"
        enabled:
          type: boolean

    WebhookSinkTestResponse:
      type: object
      required: [outcome, http_status, latency_ms]
      properties:
        outcome:
          type: string
          enum: [success, permanent_failure, retriable, unknown]
          description: |
            How the dispatcher classified the customer reply.
            `success` is any 2xx; `permanent_failure` is any 4xx
            except 408 / 429; everything else is `retriable`.
        http_status:
          type: integer
          description: |
            The actual HTTP status code returned by the customer
            endpoint. 0 indicates a network error before any
            response was read.
        latency_ms:
          type: integer
          format: int64
        cause:
          type: string
          description: Short failure reason. Empty on success.

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [ok, error, skipped]
              error:
                type: string
              latency_ms:
                type: integer

    BannerActionRequest:
      type: object
      required: [token, action]
      properties:
        token:
          type: string
          description: Signed JWT minted when the banner was rendered.
        action:
          type: string
          enum: [report_phishing, mark_safe, trust_sender, ignore]

    BannerActionResponse:
      type: object
      required: [status, action, pseudonymized_message_id]
      properties:
        status:
          type: string
          example: ok
        action:
          type: string
        pseudonymized_message_id:
          type: string

    QuarantineReleaseRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        approver_role:
          type: string
          enum: [admin, security_lead, end_user]
        justification:
          type: string

    QuarantineReleaseResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        released_at:
          type: string
          format: date-time

    MicroLesson:
      type: object
      required: [category, locale, title, body]
      properties:
        category:
          type: string
        locale:
          type: string
        title:
          type: string
        body:
          type: string
        cta_url:
          type: string

    EscalationResolveRequest:
      description: |
        Payload for POST /v1/escalation/resolve. Field names + enum
        values are the canonical SOC-outcome vocabulary used by
        `internal/dto.EscalationOutcome`; the handler decodes with
        `DisallowUnknownFields()` so this schema must stay in lock-
        step with the Go struct tags at internal/handler/escalation.go.
      type: object
      required: [ticket_id, outcome]
      properties:
        ticket_id:
          type: string
        resolver_hash:
          type: string
          description: |
            Privacy-hash identifying the SecOps engineer who resolved
            the ticket. Optional in the request; populated by the
            handler from request context if not supplied.
        outcome:
          type: string
          description: |
            SOC verdict on the escalated incident. Drives the feedback
            sink + training pipeline at internal/service/agent/escalation.go.
          enum:
            - confirmed_phishing
            - false_positive
            - requires_hunting
            - closed_no_action
        notes:
          type: string

    EscalationResolveResponse:
      description: |
        Successful resolve responses return the full updated
        EscalationTicket (including timeline, outcome, resolution
        notes). This schema documents the response wrapper kept for
        backward compatibility with first-generation clients; new
        clients should consume EscalationTicket directly.
      type: object
      properties:
        status:
          type: string
        ticket_id:
          type: string

    EscalationTicket:
      type: object
      description: |
        Structured incident record returned by GET
        /v1/escalation/{ticket_id}. Pseudonymised — never carries
        raw subject / sender / body content.
      properties:
        ticket_id:
          type: string
        tenant_id:
          type: string
        created_at:
          type: string
          format: date-time
        reason:
          type: string
          enum: [confirmed_breach, account_compromise, zero_day_attachment, ai_low_confidence, user_requested, ops_alert]
        incident:
          type: object
          properties:
            pseudo_message_id: { type: string }
            tier: { type: string }
            category: { type: string }
            reason: { type: string }
            score: { type: number }
            affected_user_count: { type: integer }
            ai_summary: { type: string }
            indicators:
              type: array
              items: { type: string }
            detected_at: { type: string, format: date-time }
        timeline:
          type: array
          items:
            type: object
            properties:
              occurred_at: { type: string, format: date-time }
              step: { type: string }
              detail: { type: string }
        outcome:
          type: string
          enum: ["", confirmed_phishing, false_positive, requires_hunting, closed_no_action]
        resolved_at:
          type: string
          format: date-time
        resolver_hash:
          type: string
        resolution_notes:
          type: string
      required: [ticket_id, tenant_id, created_at, reason]

    MessageTrailResponse:
      type: object
      description: |
        Per-message investigation trail returned by GET
        /v1/investigation/message/{pseudo_id}. Pseudonymised — all
        identifying participant fields are hashes, never raw
        addresses.
      required: [result]
      properties:
        result:
          $ref: "#/components/schemas/EvaluationResultSummary"
        communication_history:
          $ref: "#/components/schemas/CommunicationHistorySummary"

    SenderTrailResponse:
      type: object
      description: |
        Per-sender investigation trail returned by GET
        /v1/investigation/sender/{sender_hash}. Includes the recent
        evaluation verdicts the sender produced, the recipient
        fan-out across the tenant, and a small aggregate envelope
        the dashboard renders without paging the slices.
      required: [sender_hash, verdicts, communication_histories, aggregate]
      properties:
        sender_hash:
          type: string
          description: Echoed back base64url so the caller can confirm decode.
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationResultSummary"
        communication_histories:
          type: array
          items:
            $ref: "#/components/schemas/CommunicationHistorySummary"
        aggregate:
          $ref: "#/components/schemas/SenderTrailAggregate"

    EvaluationResultSummary:
      type: object
      description: |
        Compact projection of one evaluation_results row. Pseudonyms
        are base64url-encoded; raw addresses never appear.
      required: [id, score, tier, evaluated_at]
      properties:
        id:
          type: string
        correlation_id:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        tier:
          type: string
        primary_category:
          type: string
        secondary_categories:
          type: array
          items: { type: string }
        reason_codes:
          type: array
          items: { type: string }
        degraded:
          type: boolean
        sender_hash:
          type: string
          description: base64url-encoded pseudonym; empty on legacy rows.
        recipient_hash:
          type: string
          description: base64url-encoded pseudonym; empty on legacy rows.
        evaluated_at:
          type: string
          format: date-time

    CommunicationHistorySummary:
      type: object
      description: |
        Compact projection of one communication_histories row. Used
        as both the per-message join target and as one element of
        the per-sender recipient fan-out.
      required: [sender_hash, recipient_hash, count_7d, count_30d, first_seen_at, last_seen_at]
      properties:
        sender_hash:
          type: string
        recipient_hash:
          type: string
        sender_domain:
          type: string
          description: Domain string when persisted unhashed (legacy rows).
        count_7d:
          type: integer
        count_30d:
          type: integer
        typical_hour:
          type: integer
          minimum: 0
          maximum: 23
          description: |
            Hour-of-day bucket (UTC) when this (sender, recipient) pair
            most frequently exchanges traffic. Populated by the
            relationship worker's CAS cycle after enough observations
            accumulate. Optional / omitted on the wire when the worker
            has not yet produced a baseline (internal sentinel
            TypicalHourUnset = -1); the handler suppresses the field
            instead of emitting -1 so spec validators do not reject
            the response.
        relationship:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    SenderTrailAggregate:
      type: object
      description: |
        Derived headline metrics for SenderTrailResponse. Computed in
        process from the verdicts + recipients slices; no additional
        repository round-trip is performed.
      required: [total_verdicts, high_risk_verdicts, max_score, distinct_recipients, total_sightings_window]
      properties:
        total_verdicts:
          type: integer
        high_risk_verdicts:
          type: integer
          description: |
            Count of verdicts whose tier is "blocked" or "high".
        max_score:
          type: integer
          minimum: 0
          maximum: 100
        last_verdict_at:
          type: string
          format: date-time
        distinct_recipients:
          type: integer
          description: |
            Recipients whose LastSeenAt falls within the look-back
            window (defaults to 30 days).
        total_sightings_window:
          type: integer
          description: |
            Sum of count_30d across the recipients counted in
            distinct_recipients.

    DashboardSummary:
      type: object
      properties:
        tenant_id:
          type: string
        range:
          type: string
        evaluated:
          type: integer
        banner_distribution:
          type: object
          additionalProperties:
            type: integer
        top_categories:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              count:
                type: integer
        resilience_score:
          type: number

    PredictRecipientRequest:
      type: object
      required: [tenant_id, sender, recipients]
      properties:
        tenant_id:
          type: string
        sender:
          type: string
        recipients:
          type: array
          items:
            type: string

    PredictRecipientResponse:
      type: object
      properties:
        risk:
          type: string
          enum: [low, medium, high]
        reason:
          type: string

    PredictOpenRequest:
      type: object
      required: [tenant_id, url]
      properties:
        tenant_id:
          type: string
        url:
          type: string

    PredictOpenResponse:
      type: object
      properties:
        risk:
          type: string
          enum: [low, medium, high]
        verdict:
          type: string

    OnboardingStatus:
      type: object
      properties:
        tenant_id:
          type: string
        status:
          type: string
          enum: [not_started, in_progress, completed]
        users_discovered:
          type: integer
        groups_discovered:
          type: integer
        needs_review_count:
          type: integer

    GWSSetupStatus:
      type: object
      properties:
        service_account_configured:
          type: boolean
        delegated_admin_configured:
          type: boolean
        domain_configured:
          type: boolean
        directory_access_ok:
          type: boolean
        gmail_access_ok:
          type: boolean
        steps_remaining:
          type: array
          items:
            type: string

    Vendor:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        domain:
          type: string
        display_name:
          type: string
        approved:
          type: boolean
        auto_discovered:
          type: boolean
        confidence:
          type: number
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VendorCreateRequest:
      type: object
      required: [tenant_id, domain]
      properties:
        tenant_id:
          type: string
        domain:
          type: string
        display_name:
          type: string

    OrgGraphSnapshot:
      type: object
      properties:
        tenant_id:
          type: string
        built_at:
          type: string
          format: date-time
        graph:
          type: object
          description: JSON blob of the org graph structure
        high_risk_count:
          type: integer
        department_count:
          type: integer
        employee_count:
          type: integer
        group_count:
          type: integer

    IntelFeed:
      type: object
      required: [id, name, provider, url, fetch_interval_sec, enabled, consecutive_failures, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          type: string
          enum: [urlhaus, misp, stix-taxii, csv]
        url:
          type: string
          format: uri
        fetch_interval_sec:
          type: integer
          minimum: 60
        enabled:
          type: boolean
        last_fetched_at:
          type: string
          format: date-time
        last_ok:
          type: boolean
        last_error:
          type: string
        consecutive_failures:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time

    IntelFeedList:
      type: object
      required: [feeds]
      properties:
        feeds:
          type: array
          items:
            $ref: "#/components/schemas/IntelFeed"

    IntelFeedCreate:
      type: object
      required: [name, provider, url]
      properties:
        name:
          type: string
        provider:
          type: string
          enum: [urlhaus, misp, stix-taxii, csv]
        url:
          type: string
          format: uri
        fetch_interval_sec:
          type: integer
          minimum: 60
        enabled:
          type: boolean

    IntelFeedPatch:
      type: object
      properties:
        url:
          type: string
          format: uri
        fetch_interval_sec:
          type: integer
          minimum: 60
        enabled:
          type: boolean

    IntelRefreshResponse:
      type: object
      required: [indicators_upserted]
      properties:
        indicators_upserted:
          type: integer
          minimum: 0

    IntelIndicatorMatch:
      type: object
      required: [hash_hex, indicator, indicator_type, feed_id, feed_name, severity, last_seen]
      properties:
        hash_hex:
          type: string
        indicator:
          type: string
        indicator_type:
          type: string
          enum: [domain, url, ip, sha256]
        feed_id:
          type: string
        feed_name:
          type: string
        severity:
          type: integer
          minimum: 0
          maximum: 100
        tags:
          type: array
          items:
            type: string
        last_seen:
          type: string
          format: date-time

    IntelIndicatorLookup:
      type: object
      required: [indicator, matches]
      properties:
        indicator:
          type: string
        matches:
          type: array
          items:
            $ref: "#/components/schemas/IntelIndicatorMatch"
